# openspec/config.yaml — SDD project context for frontend-houndfe
#
# Source of truth for the Spec-Driven Development (SDD) contract used by every
# agent and orchestrator that touches this repository. The init phase produces
# this file once per project; subsequent phases read it to align on stack,
# testing discipline, and artifact conventions.
#
# Status: ACTIVE
# Last updated: 2026-08-25
# Generated by: openspec/init (sdd-init/frontend-houndfe)

project:
  name: frontend-houndfe
  display_name: Hound FE (POS & Admin Frontend)
  slug: frontend-houndfe
  description: |
    Vue 3 + Vite + TypeScript single-page frontend for the Hound POS and admin
    suite. Drives in-store sales, quotations, catalog, promotions, and tenant
    administration. Backend is HTTP/REST accessed via authenticated axios.
  working_directory: /home/aldrich_coder45/Desktop/workspace/houndfe/frontend-houndfe
  package_manager: pnpm
  node_engine: ">=20.19.0 || >=22.12.0"
  initial_change: payment-details-admin
  initial_change_title: "PaymentDetails — datos bancarios admin CRUD"

# ---------------------------------------------------------------------------
# Stack — every dependency the SDD contract assumes when reading or writing
# source. New dependencies must be justified in the change's design.md.
# ---------------------------------------------------------------------------
stack:
  language: typescript
  typescript_version: "~5.9"
  framework: vue
  framework_version: "^3.5.29"
  build_tool: vite
  build_tool_version: "^7.3.1"
  bundler: "@vitejs/plugin-vue ^6.0.4"
  component_model: composition-api-with-script-setup-typescript
  ui_library: "@nuxt/ui ^4.6.0"   # standalone (not the Nuxt framework)
  styling: "tailwindcss ^4.2.2 (via @tailwindcss/vite)"
  router: "vue-router ^5.0.3"
  state_pinia: "pinia ^3.0.4"
  server_state: "@tanstack/vue-query ^5.95.2"
  table_engine: "@tanstack/vue-table ^8.21.3"
  authorization: "@casl/ability ^6.8.0 + @casl/vue ^2.2.6"
  http_client: "axios ^1.14.0"
  validation: "zod ^3.25.76"
  utilities: "@vueuse/core ^14.2.1, @internationalized/date ^3.12.1, date-fns ^4.1.0"
  testing: "@vue/test-utils ^2.4.6, vitest ^4.0.18, jsdom ^28.1.0"
  type_checking: "vue-tsc ^3.2.5"
  linting: "oxlint ~1.50.0 + eslint ^10.0.2 + prettier 3.8.1"

# ---------------------------------------------------------------------------
# Repository conventions observed across openspec/changes/*/
# ---------------------------------------------------------------------------
conventions:
  # src/ layered architecture (mirrors the quotations-crud reference change):
  src_layout:
    app:    "src/app/        (providers, router, navigation registry)"
    core:   "src/core/       (shared cross-feature primitives: queries, forms, ui)"
    features: "src/features/<feature>/{api,composables,components,views,utils,interfaces,constants,stores}/"
    test:   "src/test/       (vitest helpers, e.g. mountWithUApp.ts)"
  feature_module_shape:
    required_when_multi_file:
      - "api/<feature>.api.ts          (axios calls; one method per endpoint)"
      - "composables/use<Feature>.ts   (TanStack Query wrappers + mutations)"
      - "views/<Feature>ListView.vue   (list screens)"
      - "views/<Feature>DetailView.vue (detail/create screens)"
      - "interfaces/<feature>.types.ts (zod schemas + inferred DTOs)"
    shared_primitives_to_reuse:
      - "AppDataTable, StatusDotBadge, ConfirmModal, AppBadge, AppButton"
      - "AssignCustomerSlideover, ProductSearchPanel, PriceListSelector"
      - "formatCentsMXN (utils/currency.utils.ts)"
      - "userMessageForError (shared error toast helper)"
  typescript_strictness:
    sfc_sections_order: [script, template, style]
    prefer: ["computed for derivations", "props-down/events-up", "composables for stateful/side-effect logic"]
    avoid: ["Options API", "any without justification", "reactive() when ref() suffices"]
  routing_and_authorization:
    register_subject_in:
      - "src/features/auth/authorization/ability.ts (APP_SUBJECTS)"
      - "src/features/auth/authorization/auth.types.ts (AppSubject union)"
    sidebar_entry_in: "src/app/navigation/navigation.registry.ts"
    routes_in: "src/app/router/index.ts"
    gating: "every guarded route carries `meta.permission` checked by the global beforeEach"
    required_actions_for_crud_admin_pages:
      list:    "read:<Subject>"
      create:  "create:<Subject>"
      update:  "update:<Subject>"
      delete:  "delete:<Subject>"

# ---------------------------------------------------------------------------
# Artifact store — where every SDD phase writes its output.
# ---------------------------------------------------------------------------
artifact_store:
  type: openspec
  root: openspec/
  changes_dir: openspec/changes
  archive_dir: openspec/changes/archive
  specs_dir: openspec/specs
  changes_layout: |
    openspec/changes/<change-id>/
      exploration.md    # Phase: explore  — repo reconnaissance + capability map
      proposal.md       # Phase: propose  — Why/What/Capabilities/Approach/Out-of-Scope
      design.md         # Phase: design   — Architecture, data contracts, components, errors
      tasks.md          # Phase: tasks    — Sliced work units with TDD checklist + commit msg
      verify-report.md  # Phase: verify   — Test/type-check/build/requirements audit results
      specs/            # Phase: spec     — Per-capability WHEN/SHALL/IF-THEN requirements
  change_id_naming: kebab-case, descriptive, no date prefix in active changes
  archived_change_id_naming: "<ISO-date>-<kebab-case-name>"

# ---------------------------------------------------------------------------
# Strict TDD — non-negotiable discipline. Each slice goes through all four
# steps in order. A slice is only "done" when its test cmd exits 0.
# ---------------------------------------------------------------------------
strict_tdd: true
tdd_cycle:
  order: [RED, GREEN, TRIANGULATE, REFACTOR]
  red:
    intent: "Write the failing test that describes the new contract."
    verification: "pnpm test:unit --run reports >=1 failure for the slice's target file."
  green:
    intent: "Minimum implementation that satisfies the test (no extras)."
    verification: "pnpm test:unit --run passes for the target file; no other slice broken."
  triangulate:
    intent: "Add adjacent tests covering alternate inputs, edge cases, and error paths."
    verification: "All new tests pass; original red test still asserts the same contract."
  refactor:
    intent: "Tighten names, remove duplication, surface abstractions. Behavior unchanged."
    verification: "pnpm test:unit --run remains green; type-check clean."
  forbidden_in_red_green:
    - "Touching files outside the slice's listed scope."
    - "Editing existing tests to make them pass."
    - "Adding code paths not exercised by a failing test."
  slice_budget:
    max_changed_lines: 600
    rationale: "Review-friendly slice; chained PRs above this budget per branch-pr/chained-pr skills."
    overflow_action: "Split into additional slices; do not relax the budget."

# ---------------------------------------------------------------------------
# Testing runner — canonical commands and helpers.
# ---------------------------------------------------------------------------
testing:
  runner: vitest
  environment: jsdom
  config_files:
    - vitest.config.ts
    - tsconfig.vitest.json
  global_setup: vitest.setup.ts
  helpers:
    - path: src/test/mountWithUApp.ts
      purpose: |
        mountWithUApp<T>(component, options) wraps <UApp> around the component
        so Nuxt UI's TooltipProvider, ToastProvider, ModalProvider are
        available via inject() during tests. Use this INSTEAD of mount() for
        any component that uses UTooltip, UModal, UToast, UDropdownMenu, etc.
  commands:
    unit_tests:
      cmd: "pnpm test:unit --run"
      invocation: "vitest run (CI-equivalent: CI=true npx vitest run)"
      use_when: "Default gate for every TDD step and every slice completion."
    unit_tests_watch:
      cmd: "pnpm test:unit"
      use_when: "Local development loop only; NOT acceptable as a verification gate."
    type_check:
      cmd: "pnpm build"
      sub_step: "vue-tsc --build"
      use_when: "Slice completion + final verify."
    build:
      cmd: "pnpm build"
      sub_steps: ["type-check", "build-only (vite build)"]
      use_when: "Final verify-report only; not per slice (S1 of any feature accepts build-failing-until-views-exist)."
    lint:
      cmd: "pnpm lint"
      use_when: "Pre-commit; not part of TDD gate."
  test_file_naming:
    convention: "Co-located *.spec.ts or *.test.ts next to the implementation file."
    examples:
      - "src/features/quotations/api/quotation.api.ts -> quotation.api.test.ts"
      - "src/features/quotations/views/QuotationsListView.vue -> QuotationsListView.test.ts"
  mocking:
    http: "vi.mock('axios') at the top of test files; provide http.post/get/... with vi.fn()."
    casl: "Test-only abilityBuilder; never share across slices."

# ---------------------------------------------------------------------------
# Phase rules — the SDD pipeline every change must traverse.
# Phase order is fixed; artifact names match the changes_layout above.
# ---------------------------------------------------------------------------
phases:
  init:
    purpose: "Bootstrap openspec/config.yaml and skill-registry mapping for the project."
    inputs: ["parent request with project context, feature name, artifact store choice"]
    outputs: ["openspec/config.yaml (this file)", "phase envelope in memory provider"]
    next_phase: explore

  explore:
    purpose: "Reconnaissance + capability mapping."
    inputs: ["init outputs", "feature brief from user"]
    outputs: ["openspec/changes/<change>/exploration.md"]
    must_include:
      - "Relevant existing features and shared primitives to reuse."
      - "CASL subjects to register; sidebar/router touch points."
      - "API surface sketch (endpoints + methods) inferred from backend conventions."
      - "Open questions / unknowns table."
    next_phase: propose

  propose:
    purpose: "Commit to scope and approach before investing in design."
    inputs: ["exploration.md", "user clarifications"]
    outputs: ["openspec/changes/<change>/proposal.md"]
    must_include_sections:
      - Why
      - What Changes
      - Out of Scope
      - Capabilities (New / Modified, scoped to openspec/specs)
      - Approach
      - Impact (areas + reuse)
      - Risks / Unknowns
      - First Slice Scope
      - Rollback Plan
      - Success Criteria
    next_phase: design

  design:
    purpose: "Lock contracts: types, component split, data flow, errors, permissions."
    inputs: ["proposal.md"]
    outputs: ["openspec/changes/<change>/design.md"]
    must_include:
      - "Per-component split with single-responsibility justification."
      - "Zod schemas / DTO shapes derived from backend."
      - "TanStack Query keys + cache invalidation + mutation strategy."
      - "Permission matrix (action -> CASL verb)."
      - "Empty / loading / error states for every view."
      - "Reused primitives and why (no reinvention)."
    next_phase: spec

  spec:
    purpose: "Codify requirements in WHEN/SHALL/IF-THEN form for review and verification."
    inputs: ["design.md", "proposal.md"]
    outputs: ["openspec/changes/<change>/specs/<capability>/spec.md"]
    must_include:
      - "Purpose"
      - "Requirements (REQ-XXX-NNN) with SHALL/SHOULD statements."
      - "Scenarios with `#### Scenario:` and `#### Given/When/Then/Then(negative)` blocks."
    next_phase: tasks

  tasks:
    purpose: "Decompose into strict-TDD slices within the 400-line budget."
    inputs: ["design.md", "specs/*.md"]
    outputs: ["openspec/changes/<change>/tasks.md"]
    must_include_sections:
      - "Review Workload Forecast (lines estimate + 400-budget risk + chain strategy)"
      - "Work Units table (slice #, goal, test cmd, runtime path, rollback)"
      - "Dependency Graph (ASCII)"
      - "Implementation Order (numbered, dependency-respecting)"
      - "Per-slice subsections with: TDD steps (RED/GREEN/TRIANGULATE/REFACTOR), Files list (NEW + MOD), Verify block, Commit message"
    next_phase: apply

  apply:
    purpose: "Implement slices one at a time, each ending in a green test cmd and commit."
    inputs: ["tasks.md"]
    outputs: ["incremental commits per slice", "updated source tree"]
    discipline:
      - "Never start a slice before its dependency slices are merged."
      - "Each slice is its own commit; commit message matches tasks.md verbatim."
      - "Forbidden: edit tests to pass, broaden scopes, add unstated deps."
      - "Forbidden: skip TRIANGULATE or REFACTOR."
    next_phase: verify

  verify:
    purpose: "Independent verification across test, type, build, requirements."
    inputs: ["merged slices", "specs/*.md", "design.md"]
    outputs: ["openspec/changes/<change>/verify-report.md"]
    must_include_sections:
      - "Test Results (pnpm test:unit --run; slice-specific test files cited)"
      - "Type Check (vue-tsc --build)"
      - "Build (vite build)"
      - "Requirements Audit (per REQ -> status + evidence with file:line)"
      - "Risks observed"
      - "Verdict"
    next_phase: archive

  archive:
    purpose: "Move the change to openspec/changes/archive/ with an archive-report."
    inputs: ["verify-report.md (PASS verdict)"]
    outputs:
      - "openspec/changes/archive/<ISO-date>-<change>/"
      - "archive-report.md linking slice commits and verify outcome."
    next_phase: null


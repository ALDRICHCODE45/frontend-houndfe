<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoundFe · Desde la venta</title>
<style>
:root{
--hf-page:#f5f6f8;--hf-surface:#ffffff;--hf-surface-muted:#e7eef7;--hf-field:#ffffff;--hf-field-border:#8593a3;
--hf-ink:#24313d;--hf-heading:#173968;--hf-muted:#576574;--hf-border:#dce2e8;
--hf-action:#2442f6;--hf-on-action:#ffffff;--hf-active:#2442f6;--hf-active-soft:#edf0ff;--hf-focus:#2442f6;
--hf-gold:#f6bb13;--hf-gold-soft:#fff5d6;--hf-gold-ink:#443218;
--hf-warning:#805511;--hf-warning-soft:#fff5d6;--hf-success:#236044;
--hf-danger:#b42318;--hf-danger-soft:#fef3f2;--hf-danger-border:#f4b8b2;
--hf-font:'Geist', ui-sans-serif, system-ui, sans-serif;
--hf-radius-card:12px;--hf-radius-control:6px;--hf-control-height:44px;
--shadow-soft:0 1px 2px color-mix(in srgb,var(--hf-ink) 5%,transparent);
--shadow-pop:0 12px 32px -12px color-mix(in srgb,var(--hf-ink) 24%,transparent),0 2px 6px color-mix(in srgb,var(--hf-ink) 8%,transparent);
--scrim:color-mix(in srgb,var(--hf-ink) 40%,transparent);
color-scheme:light;
}
html.dark{
--hf-page:#0e1520;--hf-surface:#192332;--hf-surface-muted:#202e43;--hf-field:#121d2c;--hf-field-border:#64758d;
--hf-ink:#edf2fa;--hf-heading:#edf2fa;--hf-muted:#adbcd0;--hf-border:#354459;
--hf-action:#91b0ff;--hf-on-action:#132344;--hf-active:#b3caff;--hf-active-soft:#223555;--hf-focus:#a6c1ff;
--hf-gold:#f2c456;--hf-gold-soft:#3b311d;--hf-gold-ink:#f2cb71;
--hf-warning:#f2cb71;--hf-warning-soft:#3b311d;--hf-success:#a2d9b9;
--hf-danger:#ffb4ab;--hf-danger-soft:#3d2220;--hf-danger-border:#7a3f3b;
--shadow-soft:0 1px 2px color-mix(in srgb,var(--hf-page) 40%,transparent);
--shadow-pop:0 12px 32px -12px color-mix(in srgb,var(--hf-page) 90%,transparent),0 2px 6px color-mix(in srgb,var(--hf-page) 60%,transparent);
--scrim:color-mix(in srgb,var(--hf-page) 70%,transparent);
color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:color-mix(in srgb,var(--hf-surface-muted) 45%,var(--hf-page));color:var(--hf-ink);font:400 14px/1.5 var(--hf-font);font-feature-settings:"cv11","ss01"}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{color:var(--hf-heading);font-weight:600}
a{color:inherit}
:focus-visible{outline:2px solid var(--hf-focus);outline-offset:2px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon.sm{width:16px;height:16px}
.icon.xs{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fig{font-variant-numeric:tabular-nums}

/* artboard tools, outside the mock */
.tools{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:4px;max-width:calc(100vw - 24px);background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:12px;box-shadow:var(--shadow-pop)}
.tools button{height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--hf-ink);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.tools button:hover{background:var(--hf-surface-muted)}
.tools .sep{width:1px;margin:6px 2px;background:var(--hf-border)}

/* stage and frame */
.stage{padding:64px 16px 16px;display:flex;justify-content:center}
.app{position:relative;width:min(1440px,100%);height:calc(100vh - 80px);min-height:600px;display:flex;background:var(--hf-page);border:1px solid var(--hf-border);border-radius:12px;overflow:hidden;container:app / inline-size}
.stage.mobile .app{width:390px;height:min(844px,calc(100vh - 80px))}

/* sidebar */
.sidebar{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding:16px 12px;background:var(--hf-surface);border-right:1px solid var(--hf-border);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.brand-mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--hf-action);color:var(--hf-on-action)}
.brand-name{font-weight:600;color:var(--hf-heading);font-size:15px;letter-spacing:-0.01em}
.tenant{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;margin-bottom:8px;border:1px solid var(--hf-border);border-radius:8px;background:transparent;font-size:13px;font-weight:500;cursor:pointer;width:100%;text-align:left}
.tenant:hover{border-color:var(--hf-field-border)}
.tenant .dot{width:8px;height:8px;border-radius:50%;background:var(--hf-success)}
.tenant span:nth-child(2){flex:1}
.nav-group{padding:12px 10px 4px;font-size:12px;font-weight:600;color:var(--hf-muted)}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;font-size:14px;font-weight:500;color:var(--hf-ink);text-decoration:none}
.nav a .icon{color:var(--hf-muted)}
.nav a:hover{background:var(--hf-surface-muted)}
.nav a[aria-current="page"]{background:var(--hf-active-soft);color:var(--hf-active)}
.nav a[aria-current="page"] .icon{color:var(--hf-active)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--hf-warning)}

/* main column and header */
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;background:var(--hf-surface);border-bottom:1px solid var(--hf-border);flex-shrink:0}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--hf-muted);cursor:pointer;flex-shrink:0}
.icon-btn:hover{background:var(--hf-surface-muted);color:var(--hf-ink)}
.menu-btn{display:none;margin-left:-10px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--hf-muted)}
.crumbs ol{display:flex;align-items:center;gap:6px;min-width:0}
.crumbs li{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.crumbs li + li::before{content:"/";color:var(--hf-border)}
.crumbs a{text-decoration:none;border-radius:4px}
.crumbs a:hover{color:var(--hf-ink)}
.crumbs [aria-current]{color:var(--hf-ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:240px;height:36px;padding:0 10px;border:1px solid var(--hf-border);border-radius:8px;background:var(--hf-field);color:var(--hf-muted);font-size:13px;cursor:pointer}
.search:hover{border-color:var(--hf-field-border)}
.search kbd{margin-left:auto;font:inherit;font-size:12px;padding:0 6px;border:1px solid var(--hf-border);border-radius:4px}
.user{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.user:hover{background:var(--hf-surface-muted)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--hf-gold-soft);color:var(--hf-gold-ink);font-size:12px;font-weight:600;flex-shrink:0}
.user-txt{display:grid;line-height:1.25}
.user-txt b{font-size:13px;font-weight:600;color:var(--hf-ink)}
.user-txt small{font-size:12px;color:var(--hf-muted)}
.search-m{display:none}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.page{max-width:1160px;margin:0 auto;padding:24px 32px 48px}

/* page header */
.ph{display:grid;gap:6px;margin-bottom:24px}
.ph h1{font-size:clamp(1.75rem,1.55rem + 0.6vw,2rem);line-height:1.25;letter-spacing:-0.045em}
.ph h1:focus{outline:none}
.ph p{font-size:14px;color:var(--hf-muted);max-width:62ch}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.neutral{background:var(--hf-surface-muted);color:var(--hf-muted)}
.badge.info{background:var(--hf-active-soft);color:var(--hf-active)}
.badge.success{background:color-mix(in srgb,var(--hf-success) 12%,var(--hf-surface));color:var(--hf-success)}
.badge.warning{background:var(--hf-warning-soft);color:var(--hf-warning)}
.badge.plain::before{display:none}

/* buttons */
.btn{height:44px;padding:0 16px;border:1px solid var(--hf-border);border-radius:var(--hf-radius-control);background:var(--hf-surface);color:var(--hf-ink);font-size:14px;font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--hf-field-border)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--hf-surface-muted)}
.btn.primary{background:var(--hf-action);border-color:var(--hf-action);color:var(--hf-on-action)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--hf-action) 88%,var(--hf-ink));border-color:transparent}
.btn:disabled{cursor:not-allowed;background:var(--hf-surface-muted);border-color:var(--hf-border);color:var(--hf-muted)}
.btn.busy:disabled{cursor:progress}
.mini{position:relative;height:24px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--hf-action);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.mini::after{content:"";position:absolute;inset:-10px -2px}
.mini:hover{background:var(--hf-active-soft)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* cards */
.card{background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:var(--hf-radius-card)}
.card-pad{padding:24px}
.card-h{font-size:13px;font-weight:600;color:var(--hf-muted);margin-bottom:12px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:20px}
.kpi dt{font-size:13px;color:var(--hf-muted)}
.kpi dd{margin-top:4px;font-size:24px;font-weight:600;color:var(--hf-heading);letter-spacing:-0.02em}
.kpi small{display:block;margin-top:2px;font-size:12px;color:var(--hf-muted)}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--hf-border)}
.panel-head .ph-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--hf-surface-muted);color:var(--hf-muted);flex-shrink:0}
.panel-head h2{font-size:16px}
.panel-head .sum{margin-left:auto;font-size:13px;color:var(--hf-muted);white-space:nowrap}
.panel-head .sum b{color:var(--hf-ink);font-weight:600}
.rows li{border-top:1px solid var(--hf-border);overflow:hidden}
.rows li:first-child{border-top:0}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px 10px 20px;text-decoration:none;color:inherit}
a.row:hover{background:color-mix(in srgb,var(--hf-surface-muted) 45%,var(--hf-surface))}
a.row:focus-visible{outline-offset:-2px}
.row-main{flex:1;min-width:0;display:grid;gap:2px}
.row-main b{font-weight:600;color:var(--hf-heading);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:13px;color:var(--hf-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-amt{display:grid;justify-items:end;gap:2px;text-align:right}
.row-amt b{font-weight:600;color:var(--hf-ink)}
.row-amt span{font-size:12px;color:var(--hf-muted)}
.row-badges{display:flex;gap:6px}
.row .chev{color:var(--hf-muted)}
.rows li.leaving{animation:leave .45s ease-in forwards}
@keyframes leave{0%{opacity:1;max-height:72px}40%{opacity:0;max-height:72px}100%{opacity:0;max-height:0}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:8rem;padding:40px 16px;text-align:center}
.empty .icon{width:24px;height:24px;color:var(--hf-muted)}
.empty h3{font-size:15px}
.empty p{font-size:13px;color:var(--hf-muted);max-width:28rem}

/* sale detail */
.back{display:inline-flex;align-items:center;gap:4px;height:28px;font-size:13px;font-weight:500;color:var(--hf-muted);text-decoration:none;border-radius:4px}
.back:hover{color:var(--hf-ink)}
.dh{display:grid;gap:4px;margin:8px 0 24px}
.dh-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--hf-muted)}
.dh h1{font-size:22px;line-height:1.3;letter-spacing:-0.02em}
.dh h1:focus{outline:none}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.detail-main{display:grid;gap:16px;min-width:0}

/* refund block */
.rf{overflow:hidden}
.rf + .rf{margin-top:0}
.rf-top{display:flex;align-items:flex-start;gap:16px;padding:20px 24px}
.rf-title{flex:1;min-width:0;display:grid;gap:4px}
.rf-title-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.rf-title h2{font-size:16px}
.rf-title p{font-size:13px;color:var(--hf-muted)}
.rf-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hf-border)}
.rf-figs > div{padding:16px 24px;display:grid;gap:2px;border-left:1px solid var(--hf-border);transition:background-color .6s}
.rf-figs > div:first-child{border-left:0}
.rf-figs dt{font-size:13px;color:var(--hf-muted)}
.rf-figs dd{font-size:18px;font-weight:600;color:var(--hf-ink);letter-spacing:-0.01em}
.rf-figs .due{background:var(--hf-warning-soft)}
.rf-figs .due dt{color:var(--hf-warning);font-weight:600}
.rf-figs .due dd{font-size:22px;color:var(--hf-heading)}
.rf-figs .due.flash{background:color-mix(in srgb,var(--hf-success) 18%,var(--hf-surface))}
.rf-figs .done{background:color-mix(in srgb,var(--hf-success) 12%,var(--hf-surface))}
.rf-figs .done dt{color:var(--hf-success);font-weight:600}
.rf-meter{display:flex;align-items:center;gap:12px;padding:12px 24px 16px;border-top:1px solid var(--hf-border);font-size:12px;color:var(--hf-muted)}
.bar{flex:1;height:6px;border-radius:999px;background:var(--hf-surface-muted);overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;background:var(--hf-success);transition:width .6s ease}
.locked{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--hf-muted)}
.sold dl{display:grid;gap:12px}
.sold dl > div{display:grid;gap:2px}
.sold dt{font-size:13px;color:var(--hf-muted)}
.sold dd{font-weight:500;color:var(--hf-ink)}
.sold dd.big{font-size:18px;font-weight:600;color:var(--hf-heading)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--hf-surface-muted);color:var(--hf-ink);font-size:12px;font-weight:500}
.quiet{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--hf-muted)}
.quiet .icon{margin-top:1px}

/* mobile sticky bar */
.mbar{display:none;padding:12px 16px;background:var(--hf-surface);border-top:1px solid var(--hf-border)}
.mbar .btn{width:100%}

/* notes (artboard annotation, not product UI) */
.note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border:1px dashed var(--hf-active);border-radius:8px;background:color-mix(in srgb,var(--hf-active-soft) 60%,transparent);color:var(--hf-ink);font-size:12px;line-height:1.5}
.note .icon{color:var(--hf-active);margin-top:1px}
.note b{font-weight:600;color:var(--hf-active)}
.note code{font:500 12px/1.5 var(--hf-font);font-variant-numeric:tabular-nums;color:var(--hf-heading);overflow-wrap:anywhere}
.note pre{margin:6px 0 0;padding:8px 10px;border-radius:6px;background:var(--hf-surface);white-space:pre-wrap;overflow-wrap:anywhere;font:400 12px/1.5 var(--hf-font);font-variant-numeric:tabular-nums}
body.no-notes .note{display:none}

/* dialog */
.layer{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:var(--scrim);animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.dlg{width:min(480px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:var(--hf-radius-card);box-shadow:var(--shadow-pop);animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 12px 24px}
.dlg-head > div{flex:1;min-width:0;display:grid;gap:2px}
.dlg-head h2{font-size:17px;letter-spacing:-0.01em}
.dlg-head h2:focus{outline:none}
.dlg-head p{font-size:13px;color:var(--hf-muted)}
.dlg-head .icon-btn{margin:-8px -8px 0 0}
.dlg-body{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 20px;display:grid;gap:16px;align-content:start}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px;border-top:1px solid var(--hf-border)}
.due-strip{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:8px;background:var(--hf-warning-soft)}
.due-strip span{font-size:13px;font-weight:600;color:var(--hf-warning)}
.due-strip b{font-size:20px;font-weight:600;color:var(--hf-heading);letter-spacing:-0.01em}
.due-strip small{font-size:12px;color:var(--hf-muted);font-weight:400}
.due-strip.flash{background:color-mix(in srgb,var(--hf-warning) 22%,var(--hf-surface))}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--hf-danger-border);border-radius:8px;background:var(--hf-danger-soft);color:var(--hf-ink);font-size:13px}
.alert .icon{color:var(--hf-danger);margin-top:1px}
.alert b{display:block;font-weight:600;color:var(--hf-danger)}

/* fields */
.field{display:grid;gap:6px;min-width:0;position:relative}
.lrow{display:flex;align-items:center;gap:8px;min-height:24px}
.lbl{font-size:13px;font-weight:500;color:var(--hf-ink)}
.lrow .mini{margin-left:auto}
.help{font-size:12px;color:var(--hf-muted)}
.err{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--hf-danger)}
.ctl{width:100%;min-width:0;height:var(--hf-control-height);padding:0 12px;background:var(--hf-field);border:1px solid var(--hf-border);border-radius:var(--hf-radius-control);font-size:14px;color:var(--hf-ink);transition:border-color .12s}
.ctl:hover{border-color:var(--hf-field-border)}
input.ctl:focus{outline:2px solid var(--hf-focus);outline-offset:2px}
.ctl[aria-invalid="true"],.money[data-invalid="true"]{border-color:var(--hf-danger)}
.ctl::placeholder,.money input::placeholder{color:var(--hf-muted);opacity:1}
input[type="datetime-local"].ctl{font-variant-numeric:tabular-nums}
.money{display:flex;align-items:center;padding:0}
.money:focus-within{outline:2px solid var(--hf-focus);outline-offset:2px}
.money .pre,.money .suf{padding:0 12px;color:var(--hf-muted);font-size:14px}
.money .pre{padding-right:2px}
.money .suf{font-size:12px;font-weight:600}
.money input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--hf-ink);padding:0 4px}

/* combobox */
.cb-trigger{display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;user-select:none}
.cb-trigger .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-trigger > .icon{color:var(--hf-muted);transition:transform .15s}
.cb-trigger[aria-expanded="true"]{border-color:var(--hf-field-border)}
.cb-trigger[aria-expanded="true"] > .icon{transform:rotate(180deg)}
.pop{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);padding:4px;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:8px;box-shadow:var(--shadow-pop);animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.opt{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border-radius:4px;cursor:pointer}
.opt .ol{flex:1;min-width:0}
.opt .meta{font-size:12px;color:var(--hf-muted)}
.opt.active{background:var(--hf-active-soft)}
.opt[aria-selected="true"]{font-weight:500}
.tick{display:inline-flex;color:var(--hf-active);visibility:hidden}
.opt[aria-selected="true"] .tick{visibility:visible}

/* review */
.review{display:grid;gap:0;border:1px solid var(--hf-border);border-radius:8px;overflow:hidden}
.review > div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-top:1px solid var(--hf-border)}
.review > div:first-child{border-top:0}
.review dt{font-size:13px;color:var(--hf-muted)}
.review dd{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.review dd.big{font-size:18px;font-weight:600;color:var(--hf-heading)}
.outcome{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--hf-surface-muted);font-size:13px}
.outcome .icon{color:var(--hf-muted);margin-top:1px}
.outcome.full{background:color-mix(in srgb,var(--hf-success) 12%,var(--hf-surface))}
.outcome.full .icon{color:var(--hf-success)}

/* toast */
.toasts{position:absolute;right:16px;bottom:16px;z-index:60;display:grid;gap:8px;width:min(360px,calc(100% - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:12px;box-shadow:var(--shadow-pop);animation:rise .2s ease-out}
.toast .tile{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--hf-success) 12%,var(--hf-surface));color:var(--hf-success)}
.toast b{display:block;font-size:14px;font-weight:600;color:var(--hf-heading)}
.toast p{font-size:13px;color:var(--hf-muted)}
.toast .icon-btn{width:32px;height:32px;margin:-6px -6px 0 auto}

/* drawer for mobile nav */
.nav-scrim{display:none}

/* mobile 390 */
@container app (max-width:720px){
  .sidebar{position:absolute;inset:0 auto 0 0;z-index:70;width:280px;box-shadow:var(--shadow-pop);transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s}
  .app.nav-open .sidebar{transform:none;visibility:visible}
  .app.nav-open .nav-scrim{display:block;position:absolute;inset:0;z-index:65;background:var(--scrim)}
  .topbar{height:56px;padding:0 8px 0 16px;gap:4px}
  .menu-btn{display:inline-grid}
  .search,.user-txt{display:none}
  .search-m{display:inline-grid;margin-left:auto}
  .crumbs li:not(:last-child){display:none}
  .crumbs [aria-current]{font-size:14px;font-weight:600;color:var(--hf-heading)}
  .page{padding:16px 16px 32px}
  .ph{margin-bottom:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpis .kpi:first-child{grid-column:1 / -1}
  .kpi{padding:14px 16px}
  .kpi dd{font-size:20px}
  .panels{grid-template-columns:minmax(0,1fr)}
  .panels .panel-refunds{order:-1}
  .panel-head{padding:12px 12px 12px 16px;flex-wrap:wrap}
  .row{padding:10px 8px 10px 16px;gap:8px}
  .row .chev{display:none}
  .dh{margin:4px 0 16px}
  .dh h1{font-size:17px}
  .detail{grid-template-columns:minmax(0,1fr);gap:16px}
  .rf-top{padding:16px}
  .rf.single .rf-act{display:none}
  .rf-figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rf-figs > div{padding:12px 16px}
  .rf-figs > div:nth-child(3){grid-column:1 / -1;border-left:0;border-top:1px solid var(--hf-border)}
  .rf-figs dd{font-size:16px}
  .rf-meter{padding:12px 16px}
  .card-pad{padding:16px}
  .mbar.on{display:block}
  .layer{place-items:end stretch;padding:0;padding-top:24px}
  .dlg{width:100%;border-radius:16px 16px 0 0;border-bottom:0;max-height:100%}
  .dlg-head{padding:16px 12px 8px 16px}
  .dlg-body{padding:4px 16px 16px}
  .dlg-foot{display:grid;grid-template-columns:1fr 1fr;padding:12px 16px}
  .dlg-foot.single{grid-template-columns:1fr}
  .opt{height:44px}
  .toasts{left:16px;right:16px;width:auto;bottom:16px}
  .app.has-mbar .toasts{bottom:84px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

function openSettle(refundId, trigger) {

function parseAmount(s) {
  const t = s.trim().replace(/[$,\s]/g, '');
  if (!t) return { empty: true };
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return { bad: true };
  const [i, d = ''] = t.split('.');
  return { cents: Number(i) * 100 + Number((d + '00').slice(0, 2)) };
}

function validate() {
  const r = refunds.find(x => x.id === dlg.refundId), due = outstanding(r);
  const e = {}, a = parseAmount(dlg.amount);
  if (a.empty) e.amount = 'Escribe el monto que devolviste.';
  else if (a.bad) e.amount = 'Escribe un monto válido, por ejemplo 250.00.';
  else if (a.cents < 1) e.amount = 'El monto debe ser mayor que $0.00.';
  else if (a.cents > due) e.amount = `No puede ser mayor que lo pendiente: ${money(due)}.`;
  if (!dlg.date) e.date = 'Elige la fecha y hora en que devolviste el dinero.';
  return e;
}

function bindLayer() {
  const layer = $('#layer');
  layer.addEventListener('pointerdown', e => { if (e.target === layer && !dlg.busy) closeLayer(true); });
  layer.addEventListener('keydown', onLayerKey);
  $('#d-x').addEventListener('click', () => closeLayer(true));
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on('#d-amount', 'input', e => { dlg.amount = e.target.value; dlg.key = null; });
  on('#d-ref', 'input', e => { dlg.reference = e.target.value; dlg.key = null; });
  on('#d-date', 'input', e => { dlg.date = e.target.value; dlg.key = null; });
  on('#d-all', 'click', () => {
    const r = refunds.find(x => x.id === dlg.refundId);
    dlg.amount = plain(outstanding(r)); dlg.key = null;
    delete dlg.errors.amount;
    renderLayer('#d-amount');
  });
  on('#d-cancel', 'click', () => closeLayer(true));
  on('#d-next', 'click', () => {
    dlg.errors = validate();
    const first = ['amount', 'date'].find(k => dlg.errors[k]);
    if (first) { renderLayer(first === 'amount' ? '#d-amount' : '#d-date'); return; }
    dlg.alert = null;
    dlg.step = 'review';
    if (!dlg.key) dlg.key = uuid();   // created when the confirm step opens
    renderLayer('#d-confirm');
  });
  on('#d-back', 'click', () => { dlg.step = 'form'; renderLayer('#d-amount'); });
  on('#d-confirm', 'click', submit);
  on('#d-close-ok', 'click', () => closeLayer(true));

/* method combobox */
let mcb = null;
function toggleMethod(force) {
  const tr = $('#d-method');
  if (mcb && force !== true) { closeMethod(true); return; }
  const keys = Object.keys(METHOD);
  const r = refunds.find(x => x.id === dlg.refundId);
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.innerHTML = `<ul role="listbox" id="d-method-lb" aria-labelledby="d-method-l">${keys.map((k, i) => `<li role="option" id="d-m-o${i}" data-k="${k}" class="opt" aria-selected="${k === dlg.method}"><span class="ol">${METHOD[k]}</span>${k === r.method ? '<span class="meta">Pago original</span>' : ''}<span class="tick">${ic('check', 'sm')}</span></li>`).join('')}</ul>`;
  $('#f-method').appendChild(pop);
  tr.setAttribute('aria-expanded', 'true');
  mcb = { pop, keys, active: keys.indexOf(dlg.method) };
  setMActive(mcb.active);
  pop.addEventListener('pointerdown', e => e.preventDefault());
  pop.addEventListener('click', e => { const li = e.target.closest('[role="option"]'); if (li) pickMethod(li.dataset.k); });
  pop.addEventListener('mousemove', e => { const li = e.target.closest('[role="option"]'); if (li) setMActive(mcb.keys.indexOf(li.dataset.k)); });
}
function setMActive(i) {
  mcb.active = i;
  $$('.opt', mcb.pop).forEach((li, j) => li.classList.toggle('active', j === i));
  $('#d-method').setAttribute('aria-activedescendant', `d-m-o${i}`);
}
function closeMethod(focus) {
  if (!mcb) return;
  mcb.pop.remove(); mcb = null;
  const tr = $('#d-method');
  if (tr) { tr.setAttribute('aria-expanded', 'false'); tr.removeAttribute('aria-activedescendant'); if (focus) tr.focus(); }
}
function pickMethod(k) {
  if (dlg.method !== k) dlg.key = null;
  dlg.method = k;
  closeMethod(false);
  $('#d-method .txt').textContent = METHOD[k];
  $('#d-method').focus();
}
function onMethodKey(e) {
  if (!mcb) {
    if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); toggleMethod(true); }
    return;
  }
  const n = mcb.keys.length;
  if (e.key === 'ArrowDown') { e.preventDefault(); setMActive(Math.min(n - 1, mcb.active + 1)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setMActive(Math.max(0, mcb.active - 1)); }
  else if (e.key === 'Home') { e.preventDefault(); setMActive(0); }
  else if (e.key === 'End') { e.preventDefault(); setMActive(n - 1); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickMethod(mcb.keys[mcb.active]); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMethod(true); }
  else if (e.key === 'Tab') closeMethod(false);
}
document.addEventListener('pointerdown', e => { if (mcb && !$('#f-method').contains(e.target)) closeMethod(false); });

function onLayerKey(e) {
  if (e.key === 'Escape' && !mcb) { e.preventDefault(); if (!dlg.busy) closeLayer(true); return; }
  if (e.key !== 'Tab') return;
  const f = $$('#layer button:not(:disabled), #layer input, #layer [tabindex="0"]').filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function closeLayer(restore) {
  if (!dlg) return;
  closeMethod(false);
  const { trigger, step, refundId } = dlg;
  const wasGone = step === 'settled409';
  dlg = null;
  $('#layer-root').innerHTML = '';
  if (wasGone) { applyGone(refundId); return; }
  if (restore && trigger && document.body.contains(trigger)) trigger.focus();
}

/* ---------- simulated server (contract responses) ---------- */
function submit() {
  if (dlg.busy) return;   // the button is disabled while in flight, so no IDEMPOTENCY_KEY_IN_FLIGHT from double clicks
  dlg.busy = true;
  renderLayer('#d-confirm');
  const body = bodyFor(), refundId = dlg.refundId;
  setTimeout(() => {
    if (!dlg) return;
    dlg.busy = false;
    const r = refunds.find(x => x.id === refundId);
    const mode = serverMode;
    if (mode !== 'ok') { serverMode = 'ok'; paintTools(); }

    // 422 needs room for a smaller balance; a 1-cent attempt can only lose as 409.
    const newDue = body.amountCents >= 200 ? Math.floor(body.amountCents / 200) * 100 : Math.floor(body.amountCents / 2);
    if (mode === '409' || (mode === '422' && newDue < 1)) {
      // 409 REFUND_ALREADY_SETTLED: another user completed it in the meantime.
      dlg.snapshot = clone(r);
      dlg.step = 'settled409';
      dlg.alert = { title: 'Esta devolución ya se completó.' };
      renderLayer('#d-close-ok');
      return;
    }
    if (mode === '422') {
      // 422 SETTLEMENT_EXCEEDS_REFUND: someone returned part of it first; nothing was written.
      r.settledCents = r.amountCents - Math.min(newDue, outstanding(r));
      dlg.step = 'form';
      dlg.key = null;
      dlg.flash = true;
      dlg.errors = { amount: `No puede ser mayor que lo pendiente: ${money(outstanding(r))}.` };
      dlg.alert = { title: 'El monto es mayor que lo pendiente.', text: ' Actualizamos el saldo; revisa el monto.' };
      renderSaleQuiet();
      renderLayer('#d-amount');
      return;
    }
    // 200: { settlementId, refundId, saleId, amountCents, method, reference, settledAt, settledCents, outstandingCents }
    const res = { refundId, saleId: r.saleId, amountCents: body.amountCents, settledCents: r.settledCents + body.amountCents };
    res.outstandingCents = r.amountCents - res.settledCents;
    r.settledCents = res.settledCents;
    const trigger = dlg.trigger;
    dlg = null;
    $('#layer-root').innerHTML = '';
    if (res.outstandingCents > 0) {
      renderAll();
      toast('Devolución parcial registrada.', `Quedan ${money(res.outstandingCents)} por devolver.`);
      const due = $(`#due-${refundId}`);
      if (due && !reduceMotion()) { due.classList.add('flash'); setTimeout(() => due.classList.remove('flash'), 1400); }
      const t = $(`[data-settle="${refundId}"]`) || $('[data-settle-m]') || trigger;
      if (t && t.offsetParent !== null) t.focus(); else $('#view h1').focus();
    } else {
      // outstanding reached 0: the refund leaves the pending list after the refresh
      refunds = refunds.filter(x => x.id !== refundId);
      leaving = clone(r);
      closedHere[r.saleId] = { kind: 'done', amountCents: r.amountCents };
      renderAll();
      toast('Devolución completada.', `Se devolvieron ${money(r.amountCents)} en total.`);
      $('#view h1').focus();
    }
  }, 750);
}

function renderSaleQuiet() { const top = $('#scroll').scrollTop; renderAll(); $('#scroll').scrollTop = top; }

function applyGone(refundId) {
  const r = refunds.find(x => x.id === refundId);
  if (r) { refunds = refunds.filter(x => x.id !== refundId); leaving = clone(r); closedHere[r.saleId] = { kind: 'gone' }; }
  renderAll();
  $('#view h1').focus();
}

/* ---------- toast ---------- */
function toast(title, text) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tile">${ic('checkCircle', 'sm')}</span><div><b>${title}</b><p>${text}</p></div><button type="button" class="icon-btn" aria-label="Cerrar aviso">${ic('x', 'sm')}</button>`;
  $('#toasts').replaceChildren(el);
  $('button', el).addEventListener('click', () => el.remove());
  setTimeout(() => el.remove(), 6000);
}

/* ---------- artboard tools ---------- */
const SERVER_LABEL = { ok: 'éxito (200)', '422': 'excede lo pendiente (422)', '409': 'ya completado (409)' };
function paintTools() {
  const dark = document.documentElement.classList.contains('dark');
  const mobile = $('#stage').classList.contains('mobile');
  $('#t-theme').innerHTML = `${ic(dark ? 'moon' : 'sun', 'sm')}Tema: ${dark ? 'oscuro' : 'claro'}`;
  $('#t-view').innerHTML = `${ic(mobile ? 'phone' : 'monitor', 'sm')}Vista: ${mobile ? 'móvil (390)' : 'escritorio'}`;
  $('#t-server').innerHTML = `${ic('server', 'sm')}Próxima respuesta: ${SERVER_LABEL[serverMode]}`;
  $('#t-perm').innerHTML = `${ic('shield', 'sm')}Permiso: ${canUpdate ? 'ver y liquidar' : 'solo ver'}`;
  $('#t-notes').innerHTML = `${ic('note', 'sm')}Notas: ${notes ? 'visibles' : 'ocultas'}`;
  $('#t-reset').innerHTML = `${ic('rotate', 'sm')}Reiniciar datos`;
  document.body.classList.toggle('no-notes', !notes);
}
$('#t-theme').addEventListener('click', () => { document.documentElement.classList.toggle('dark'); paintTools(); });
$('#t-view').addEventListener('click', () => { closeNav(); $('#stage').classList.toggle('mobile'); paintTools(); });
$('#t-server').addEventListener('click', () => { const o = ['ok', '422', '409']; serverMode = o[(o.indexOf(serverMode) + 1) % o.length]; paintTools(); });
$('#t-perm').addEventListener('click', () => { canUpdate = !canUpdate; closeLayer(false); paintTools(); renderSaleQuiet(); });
$('#t-notes').addEventListener('click', () => { notes = !notes; paintTools(); });
$('#t-reset').addEventListener('click', () => { refunds = clone(SEED_REFUNDS); closedHere = {}; leaving = null; serverMode = 'ok'; paintTools(); go({ name: 'dashboard' }, false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && app.classList.contains('nav-open')) { closeNav(); $('#menu-btn').focus(); } });

bindNoop();
paintTools();
renderAll();
})();
</script>

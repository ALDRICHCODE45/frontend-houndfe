<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoundFe · Secciones en dos columnas</title>
<style>
:root{
--hf-page:#f5f6f8;--hf-surface:#ffffff;--hf-surface-muted:#e7eef7;--hf-field:#ffffff;--hf-field-border:#8593a3;
--hf-ink:#24313d;--hf-heading:#173968;--hf-muted:#576574;--hf-border:#dce2e8;
--hf-action:#2442f6;--hf-on-action:#ffffff;--hf-active:#2442f6;--hf-active-soft:#edf0ff;--hf-focus:#2442f6;
--hf-warning:#805511;--hf-warning-soft:#fff5d6;--hf-success:#236044;
--hf-font:'Geist', ui-sans-serif, system-ui, sans-serif;
--hf-radius-card:12px;--hf-radius-control:6px;
--ctl:40px;
--shadow-soft:0 1px 2px color-mix(in srgb,var(--hf-ink) 5%,transparent);
--shadow-pop:0 12px 32px -12px color-mix(in srgb,var(--hf-ink) 24%,transparent),0 2px 6px color-mix(in srgb,var(--hf-ink) 8%,transparent);
color-scheme:light;
}
html.dark{
--hf-page:#0e1520;--hf-surface:#192332;--hf-surface-muted:#202e43;--hf-field:#121d2c;--hf-field-border:#64758d;
--hf-ink:#edf2fa;--hf-heading:#edf2fa;--hf-muted:#adbcd0;--hf-border:#354459;
--hf-action:#91b0ff;--hf-on-action:#132344;--hf-active:#b3caff;--hf-active-soft:#223555;--hf-focus:#a6c1ff;
--hf-warning:#f2cb71;--hf-warning-soft:#3b311d;--hf-success:#a2d9b9;
--shadow-soft:0 1px 2px color-mix(in srgb,var(--hf-page) 40%,transparent);
--shadow-pop:0 12px 32px -12px color-mix(in srgb,var(--hf-page) 90%,transparent),0 2px 6px color-mix(in srgb,var(--hf-page) 60%,transparent);
color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:color-mix(in srgb,var(--hf-surface-muted) 45%,var(--hf-page));color:var(--hf-ink);font:400 14px/1.5 var(--hf-font);font-feature-settings:"cv11","ss01"}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{color:var(--hf-heading);font-weight:600}
:focus-visible{outline:2px solid var(--hf-focus);outline-offset:2px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon.sm{width:16px;height:16px}
.icon.xs{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fig{font-variant-numeric:tabular-nums}

/* artboard tools, outside the mock */
.tools{position:fixed;top:12px;right:16px;z-index:100;display:flex;gap:4px;padding:4px;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:12px;box-shadow:var(--shadow-pop)}
.tools button{height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--hf-ink);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.tools button:hover{background:var(--hf-surface-muted)}

/* stage and frame */
.stage{padding:60px 16px 16px;display:flex;justify-content:center}
.app{width:min(1440px,100%);height:calc(100vh - 76px);min-height:560px;display:flex;flex-direction:column;background:var(--hf-page);border:1px solid var(--hf-border);border-radius:12px;overflow:hidden;container:app / inline-size}
.stage.mobile .app{width:390px;height:min(844px,calc(100vh - 76px))}

/* product header chrome */
.phead{padding:16px 32px 0;background:var(--hf-surface);border-bottom:1px solid var(--hf-border)}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--hf-muted);text-decoration:none;border-radius:4px}
.back:hover{color:var(--hf-ink)}
.title-row{display:flex;align-items:center;gap:12px;margin-top:4px;min-width:0}
h1{font-size:22px;line-height:1.3;letter-spacing:-0.02em;min-width:0}
.badge{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.success{background:color-mix(in srgb,var(--hf-success) 12%,var(--hf-surface));color:var(--hf-success)}
.badge.warning{background:var(--hf-warning-soft);color:var(--hf-warning)}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs a{position:relative;display:inline-flex;align-items:center;height:44px;padding:0 12px;color:var(--hf-muted);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;min-width:0}
.tabs a:hover{color:var(--hf-ink)}
.tabs a[aria-current="page"]{color:var(--hf-heading);font-weight:600}
.tabs a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--hf-action)}
.tabs a:focus-visible{outline-offset:-2px}

/* body layout */
.scroll{flex:1;min-height:0;overflow-y:auto}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 264px;grid-template-areas:"index main summary";gap:32px;padding:24px 32px 48px;max-width:1360px;margin:0 auto}
.index{grid-area:index;position:sticky;top:24px;align-self:start}
.main{grid-area:main;min-width:0}
.summary{grid-area:summary;position:sticky;top:24px;align-self:start}

/* index */
.ix-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ix{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;padding:0 10px;border-radius:6px;color:var(--hf-ink);font-size:13px;font-weight:500;text-decoration:none}
.ix:hover{background:var(--hf-surface-muted)}
.ix[aria-current="true"]{background:var(--hf-active-soft);color:var(--hf-active)}
.ix-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ix-ok{display:inline-flex;color:var(--hf-success)}
.ix-miss{font-size:12px;font-weight:600;color:var(--hf-warning);white-space:nowrap}

/* content header */
.chead{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:36px}
.chead h2{font-size:16px}
.chead .btn{margin-left:auto}

/* cards */
.card{background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:var(--hf-radius-card);padding:24px;scroll-margin-top:24px}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-head h3{font-size:13px;font-weight:600;color:var(--hf-muted)}
.card-head h3:focus{outline:none}
.card-head h3:focus-visible{outline:2px solid var(--hf-focus)}
.card-meta{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--hf-muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 16px}
.span2{grid-column:1 / -1}

/* fields */
.field{display:grid;gap:6px;align-content:start;min-width:0}
.lrow{display:flex;align-items:center;gap:8px;min-height:24px;min-width:0}
.lbl{font-size:13px;font-weight:500;color:var(--hf-ink)}
.req{display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--hf-warning);white-space:nowrap}
.field.needs .req{display:inline-flex}
.req .dot{width:6px;height:6px;border-radius:50%;background:var(--hf-warning)}
.internal{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--hf-muted)}
.counter{margin-left:auto;font-size:12px;color:var(--hf-muted)}
.help{font-size:12px;color:var(--hf-muted)}
.ghosts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.field:hover .ghosts,.field:focus-within .ghosts{opacity:1}
.mini{position:relative;height:24px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--hf-muted);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.mini::after{content:"";position:absolute;inset:-10px -1px}
.mini:hover{background:var(--hf-surface-muted);color:var(--hf-ink)}
@media (hover:none){.ghosts{opacity:1}}

.ctl{width:100%;min-width:0;height:var(--ctl);padding:0 12px;background:var(--hf-field);border:1px solid var(--hf-border);border-radius:var(--hf-radius-control);font-size:14px;color:var(--hf-ink);transition:border-color .12s,background-color .12s}
.ctl:hover{border-color:var(--hf-field-border)}
input.ctl:focus,textarea.ctl:focus{outline:2px solid var(--hf-focus);outline-offset:2px}
textarea.ctl{display:block;height:auto;min-height:88px;padding:9px 12px;line-height:1.5;resize:vertical}
.ctl::placeholder,.num::placeholder,.pop-search input::placeholder{color:var(--hf-muted);opacity:1}

/* special value shown inside the control */
.sp{color:var(--hf-muted);font-style:italic}
.sp-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.sp-btn .hint{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--hf-muted)}
.sp-btn:hover .hint,.sp-btn:focus-visible .hint{color:var(--hf-action)}

/* segmented control */
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:2px;background:var(--hf-surface-muted);border:1px solid var(--hf-border);border-radius:8px}
.seg button{height:calc(var(--ctl) - 6px);min-width:0;padding:0 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--hf-muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:hover{color:var(--hf-ink)}
.seg button[aria-checked="true"]{background:var(--hf-surface);border-color:var(--hf-border);color:var(--hf-heading);font-weight:600;box-shadow:var(--shadow-soft)}

/* combobox */
.cb{position:relative;min-width:0}
.cb-trigger{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.cb-trigger > .icon{color:var(--hf-muted);transition:transform .15s}
.cb-trigger[aria-expanded="true"] > .icon{transform:rotate(180deg)}
.cb-trigger[aria-expanded="true"]{border-color:var(--hf-field-border)}
.cb-val{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap}
.cb-val .txt{overflow:hidden;text-overflow:ellipsis}
.ph{color:var(--hf-muted)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:4px;background:var(--hf-surface-muted);color:var(--hf-ink);font-size:12px;font-weight:500;flex-shrink:0}
.chip.more{color:var(--hf-muted);font-weight:600}
.pop{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);min-width:200px;padding:4px;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:8px;box-shadow:var(--shadow-pop);animation:pop .12s ease-out}
.pop.up{top:auto;bottom:calc(100% + 4px)}
.pop-compact{left:auto;right:-1px;width:200px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.pop-search{display:flex;align-items:center;gap:8px;height:40px;margin:-4px -4px 4px;padding:0 12px;border-bottom:1px solid var(--hf-border);color:var(--hf-muted)}
.pop-search:focus-within{box-shadow:inset 0 -2px 0 var(--hf-focus)}
.pop-search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:14px;color:var(--hf-ink)}
.pop-empty{padding:8px;font-size:13px;color:var(--hf-muted)}
.lb{list-style:none;margin:0;padding:0;max-height:264px;overflow-y:auto}
.opt{display:flex;align-items:center;gap:8px;height:36px;margin:0;padding:0 8px;border-radius:4px;font-size:14px;line-height:20px;color:var(--hf-ink);cursor:pointer}
.opt .ol{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.active{background:var(--hf-active-soft)}
.opt[aria-selected="true"]{font-weight:500}
.opt.sp-opt .ol{color:var(--hf-muted)}
.opt.first-sp{position:relative;margin-top:9px}
.opt.first-sp::before{content:"";position:absolute;left:0;right:0;top:-5px;height:1px;background:var(--hf-border)}
.tick{display:inline-flex;color:var(--hf-active);visibility:hidden}
.opt[aria-selected="true"] .tick{visibility:visible}
.box{width:16px;height:16px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--hf-field-border);border-radius:4px;background:var(--hf-field);color:var(--hf-on-action)}
.box .icon{width:12px;height:12px;stroke-width:3;visibility:hidden}
.opt[aria-selected="true"] .box{background:var(--hf-action);border-color:var(--hf-action)}
.opt[aria-selected="true"] .box .icon{visibility:visible}

/* compound unit control: [ 10 ][ kg v ] */
.unit{display:flex;align-items:stretch;padding:0}
.unit:focus-within{outline:2px solid var(--hf-focus);outline-offset:2px}
.num{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:0 12px;font-size:14px;color:var(--hf-ink);font-variant-numeric:tabular-nums;outline:none}
.unit .dash{align-self:center;color:var(--hf-muted)}
.unit .sp-text{flex:1;align-self:center;padding:0 12px;min-width:0}
.unit .divider{width:1px;margin:8px 0;background:var(--hf-border);flex-shrink:0}
.unit .suffix{align-self:center;padding:0 12px;font-size:13px;color:var(--hf-muted);white-space:nowrap}
.unit .cb{display:flex;flex-shrink:0}
.unit .cb-trigger{height:100%;min-width:76px;padding:0 10px 0 12px;gap:4px;justify-content:space-between;border-radius:0 5px 5px 0}
.unit .cb-trigger:hover{background:var(--hf-surface-muted)}
.unit .cb-trigger:focus-visible{outline:none;background:var(--hf-active-soft)}
.unit .cb-val{flex:0 1 auto}

/* buttons */
.btn{height:44px;padding:0 16px;border:1px solid var(--hf-border);border-radius:var(--hf-radius-control);background:var(--hf-surface);color:var(--hf-ink);font-size:14px;font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--hf-surface-muted)}
.btn.primary{background:var(--hf-action);border-color:var(--hf-action);color:var(--hf-on-action)}
.btn:disabled{cursor:not-allowed;background:var(--hf-surface-muted);border-color:var(--hf-border);color:var(--hf-muted)}
.btn.ghost:disabled{background:transparent;border-color:transparent}
.btn.sm{height:36px;padding:0 10px;font-size:13px;font-weight:500;color:var(--hf-muted)}
.btn.sm:hover{color:var(--hf-ink)}

/* summary card */
.summary{background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:var(--hf-radius-card);padding:20px}
.summary h2{font-size:13px;color:var(--hf-muted);margin-bottom:12px}
.summary dl{margin:0;display:grid;gap:12px}
.summary dl > div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.summary dt{font-size:13px;color:var(--hf-muted)}
.summary dd{margin:0;font-weight:600;color:var(--hf-heading)}
.summary .big{font-size:20px;letter-spacing:-0.01em}

/* save bar */
.savebar{display:flex;align-items:center;gap:12px;padding:12px 32px;background:var(--hf-surface);border-top:1px solid var(--hf-border)}
.save-status{display:flex;align-items:center;gap:8px;margin-right:auto;font-size:13px;color:var(--hf-muted);min-width:0}
.save-status.dirty{color:var(--hf-ink);font-weight:500}
.save-status .dot{width:8px;height:8px;border-radius:50%;background:var(--hf-warning);flex-shrink:0}
.save-actions{display:flex;gap:8px}

/* narrower desktop: summary moves above the cards */
@container app (max-width:1100px){
  .layout{grid-template-columns:200px minmax(0,1fr);grid-template-areas:"index summary" "index main";gap:16px 32px}
  .summary{position:static;padding:16px 20px}
  .summary h2{display:none}
  .summary dl{grid-template-columns:repeat(4,minmax(0,1fr))}
  .summary dl > div{flex-direction:column;align-items:flex-start;gap:0}
  .summary .big{font-size:16px}
}
/* mobile 390 */
@container app (max-width:720px){
  .scroll{--ctl:44px}
  .phead{padding:12px 16px 0}
  h1{font-size:17px}
  .title-row{align-items:flex-start;justify-content:space-between}
  .tabs{gap:0;margin-top:4px}
  .tabs a{padding:0 6px;font-size:13px;flex:0 1 auto}
  .tabs a span{overflow:hidden;text-overflow:ellipsis}
  .tabs a[aria-current="page"]::after{left:6px;right:6px}
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"summary" "index" "main";gap:16px;padding:16px 16px 32px}
  .summary{padding:12px 16px}
  .summary dl{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
  .index{position:static}
  .ix-list{display:flex;flex-wrap:wrap;gap:6px}
  .ix{height:36px;padding:0 10px;border:1px solid var(--hf-border);background:var(--hf-surface);border-radius:999px}
  .ix[aria-current="true"]{border-color:transparent}
  .chead .btn.sm{height:44px}
  .card{padding:16px}
  .grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .seg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ghosts{opacity:1}
  .opt{height:44px}
  .savebar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 16px}
  .save-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .save-actions .btn.ghost{border-color:var(--hf-border)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="tools" role="group" aria-label="Opciones del artboard">
  <button type="button" id="t-theme"></button>
  <button type="button" id="t-view"></button>
</div>

<div class="stage" id="stage">
  <main class="app" id="app" aria-label="Editor de producto">
    <header class="phead">
      <a href="#" class="back" data-noop><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg>Productos</a>
      <div class="title-row">
        <h1>Alimento para Cachorro Raza Mediana 3 kg</h1>
        <span class="badge success">Activo</span>
      </div>
      <nav class="tabs" aria-label="Secciones del producto">
        <a href="#" data-noop><span>Identidad</span></a>
        <a href="#" data-noop><span>Presentaciones</span></a>
        <a href="#" aria-current="page"><span>Contenido</span></a>
        <a href="#" data-noop><span>Inventario</span></a>
      </nav>
    </header>

    <div class="scroll" id="scroll">
      <div class="layout">
        <nav class="index" aria-label="Grupos de contenido">
          <ol class="ix-list" id="ix-list"></ol>
        </nav>

        <div class="main">
          <div class="chead">
            <h2 id="content-h" tabindex="-1">Contenido</h2>
            <span class="badge warning" id="progress" aria-live="polite">Faltan 4</span>
            <button type="button" class="btn ghost sm"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
          </div>
          <div id="sections"></div>
        </div>

        <aside class="summary" aria-labelledby="sum-h">
          <h2 id="sum-h">Resumen</h2>
          <dl>
            <div><dt>Precio de venta</dt><dd class="fig big">$489.00</dd></div>
            <div><dt>Costo</dt><dd class="fig">$330.00</dd></div>
            <div><dt>Margen</dt><dd class="fig">33%</dd></div>
            <div><dt>Existencias</dt><dd class="fig">28</dd></div>
          </dl>
        </aside>
      </div>
    </div>

    <div class="savebar">
      <p class="save-status" id="save-status" aria-live="polite"></p>
      <div class="save-actions">
        <button type="button" class="btn ghost" id="discard" disabled>Descartar</button>
        <button type="button" class="btn primary" id="save" disabled>Guardar</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICONS = {
  chevron: '<path d="m6 9 6 6 6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',

let saved = clone(INITIAL);

function isEmpty(k) {
  const v = state[k], t = FIELDS[k].type;
  if (isSpecial(v)) return false;
  if (t === 'unit') return !v.s && v.n.trim() === '';
  if (t === 'range') return !v.s && v.a.trim() === '' && v.b.trim() === '';
  if (Array.isArray(v)) return v.length === 0;
  return v == null || String(v).trim() === '';
}

/* ---------- rendering ---------- */
function comboCfg(k, part) {
  const f = FIELDS[k];
  if (part === 'u') {
    return {
      id: `cb-${k}-u`, key: k, label: `${f.label}, unidad`, options: f.units, multi: false, specials: true, compact: true,
      get: () => state[k].s || state[k].u,
      display: () => `<span class="txt">${esc(state[k].u)}</span>`,
      set: v => {
        if (isSpecial(v)) { state[k].s = v; return null; }
        const was = state[k].s; state[k].s = null; state[k].u = v;
        return was ? '.num' : null;
      }
    };
  }
  return {
    id: `cb-${k}`, key: k, labelId: `l-${k}`, label: f.label, options: f.options, multi: f.type === 'multi',
    specials: !f.noSpecial, ph: f.type === 'multi' ? 'Elige una o varias' : 'Elige una opción',
    get: () => state[k], set: v => { state[k] = v; return null; }
  };
}

function displayHTML(cfg) {
  if (cfg.display) return cfg.display();
  const v = cfg.get();
  if (isSpecial(v)) return `<span class="txt sp">${SPECIAL[v]}</span>`;
  if (Array.isArray(v)) {
    if (!v.length) return `<span class="txt ph">${cfg.ph}</span>`;
    const shown = v.slice(0, 2).map(x => `<span class="chip">${esc(x)}</span>`).join('');
    return shown + (v.length > 2 ? `<span class="chip more" aria-label="y ${v.length - 2} más">+${v.length - 2}</span>` : '');
  }
  return v ? `<span class="txt">${esc(v)}</span>` : `<span class="txt ph">${cfg.ph}</span>`;
}

function comboHTML(cfg, extraAttrs = '') {
  const name = cfg.labelId ? `aria-labelledby="${cfg.labelId}"` : `aria-label="${esc(cfg.label)}"`;
  return `<div class="cb" data-part="${cfg.compact ? 'u' : 'v'}">
    <div class="cb-trigger${cfg.compact ? '' : ' ctl'}" id="${cfg.id}" role="combobox" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="${cfg.id}-lb" ${name} ${extraAttrs}>
      <span class="cb-val">${displayHTML(cfg)}</span>${ic('chevron', 'sm')}
    </div></div>`;
}

function fieldHTML(k) {
  const f = FIELDS[k], v = state[k], id = `f-${k}`, lid = `l-${k}`;
  const textual = ['text', 'textarea', 'number'].includes(f.type);
  const sp = textual && isSpecial(v);
  const useLabelFor = (f.type === 'text' || f.type === 'textarea' || f.type === 'number' || f.type === 'unit') && !sp && !(f.type === 'unit' && v.s);
  const label = useLabelFor
    ? `<label class="lbl" id="${lid}" for="${id}">${f.label}</label>`
    : `<span class="lbl" id="${lid}">${f.label}</span>`;
  let marks = '';
  if (f.req) marks += `<span class="req"><span class="dot" aria-hidden="true"></span>Requerido para publicar</span>`;
  if (f.internal) marks += `<span class="internal">${ic('lock', 'xs')}Interno</span>`;
  let right = '';
  if (f.max) right = `<span class="counter fig" id="${id}-count">${String(v).length} de ${f.max}</span>`;
  else if (textual && !f.noSpecial && !sp) {
    right = `<span class="ghosts">${[UNK, NA].map(s => `<button type="button" class="mini" data-set="${s}" aria-label="${f.label}: marcar como ${SPECIAL[s]}">${SPECIAL[s]}</button>`).join('')}</span>`;
  }
  const describedBy = f.help ? `aria-describedby="${id}-help"` : '';
  let ctl = '';
  if (sp) {
    ctl = `<button type="button" class="ctl sp-btn" id="${id}" aria-label="${f.label}: ${SPECIAL[v]}. Escribir un valor"><span class="sp">${SPECIAL[v]}</span><span class="hint" aria-hidden="true">${ic('pen', 'xs')}Escribir</span></button>`;
  } else if (f.type === 'text') {
    ctl = `<input class="ctl" type="text" id="${id}" data-in="v" value="${esc(v)}" maxlength="${f.max}" placeholder="${esc(f.ph || '')}" aria-describedby="${id}-count">`;
  } else if (f.type === 'textarea') {
    const counter = f.max ? `aria-describedby="${id}-count"` : describedBy;
    ctl = `<textarea class="ctl" id="${id}" data-in="v" rows="${f.rows || 3}" ${f.max ? `maxlength="${f.max}"` : ''} placeholder="${esc(f.ph || '')}" ${counter}>${esc(v)}</textarea>`;
  } else if (f.type === 'number') {
    ctl = `<div class="ctl unit"><input class="num" type="text" inputmode="numeric" id="${id}" data-in="v" value="${esc(v)}" placeholder="Escribe un número"><span class="suffix" aria-hidden="true">${f.suffix}</span></div>`;
  } else if (f.type === 'single' || f.type === 'multi') {
    ctl = comboHTML(comboCfg(k));
  } else if (f.type === 'unit' || f.type === 'range') {
    const ucfg = comboCfg(k, 'u');
    let left;
    if (v.s) left = `<span class="sp-text sp" id="${id}-sp">${SPECIAL[v.s]}</span>`;
    else if (f.type === 'unit') left = `<input class="num" type="text" inputmode="decimal" id="${id}" data-in="n" value="${esc(v.n)}" placeholder="0">`;
    else left = `<input class="num" type="text" inputmode="decimal" id="${id}" data-in="a" value="${esc(v.a)}" placeholder="Mín." aria-label="${f.label}, mínimo"><span class="dash" aria-hidden="true">–</span><input class="num" type="text" inputmode="decimal" data-in="b" value="${esc(v.b)}" placeholder="Máx." aria-label="${f.label}, máximo">`;
    ctl = `<div class="ctl unit">${left}<span class="divider" aria-hidden="true"></span>${comboHTML(ucfg, v.s ? `aria-describedby="${id}-sp"` : '')}</div>`;
  } else if (f.type === 'seg') {
    ctl = `<div class="seg" role="radiogroup" aria-labelledby="${lid}">${f.options.map(o => `<button type="button" role="radio" aria-checked="${v === o}" tabindex="${v === o ? 0 : -1}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  const help = f.help ? `<p class="help" id="${id}-help">${f.help}</p>` : '';
  return `<div class="field${f.span ? ' span2' : ''}" data-key="${k}"><div class="lrow">${label}${marks}${right}</div>${ctl}${help}</div>`;
}

function renderSections() {
  $('#sections').innerHTML = GROUPS.map(g => `
    <section class="card" id="sec-${g.id}" aria-labelledby="h-${g.id}">
      <div class="card-head"><h3 id="h-${g.id}" tabindex="-1">${g.name}</h3>${g.meta ? `<span class="card-meta">${ic('calendar', 'xs')}${g.meta}</span>` : ''}</div>
      <div class="grid">${g.fields.map(fieldHTML).join('')}</div>
    </section>`).join('');
  $$('#sections .field').forEach(bindField);
}

function renderField(k, focusSel) {
  const old = $(`.field[data-key="${k}"]`);
  const tmp = document.createElement('div');
  tmp.innerHTML = fieldHTML(k);
  const nu = tmp.firstElementChild;
  old.replaceWith(nu);
  bindField(nu);
  updateMeta();
  if (focusSel) { const el = nu.querySelector(focusSel); if (el) el.focus(); }
}

/* ---------- field behavior ---------- */
function bindField(el) {
  const k = el.dataset.key, f = FIELDS[k];
  $$('[data-in]', el).forEach(inp => inp.addEventListener('input', () => {
    const part = inp.dataset.in;
    if (part === 'v') state[k] = inp.value; else state[k][part] = inp.value;
    const count = $(`#f-${k}-count`, el);
    if (count) count.textContent = `${inp.value.length} de ${f.max}`;
    updateMeta();
  }));
  $$('.mini', el).forEach(b => b.addEventListener('click', () => { state[k] = b.dataset.set; renderField(k, '.sp-btn'); }));
  const spb = $('.sp-btn', el);
  if (spb) spb.addEventListener('click', () => { state[k] = ''; renderField(k, '[data-in]'); });
  $$('.cb', el).forEach(cb => bindCombo(cb, comboCfg(k, cb.dataset.part)));
  const lbl = $('span.lbl', el);
  if (lbl) lbl.addEventListener('click', () => { const t = $('.cb-trigger, .seg [aria-checked="true"]', el); if (t) t.focus(); });
  const seg = $('.seg', el);
  if (seg) {
    const radios = $$('[role="radio"]', seg);
    const pick = (btn, focus) => {
      state[k] = btn.dataset.v;
      radios.forEach(r => { const on = r === btn; r.setAttribute('aria-checked', on); r.tabIndex = on ? 0 : -1; });
      if (focus) btn.focus();
      updateMeta();
    };
    radios.forEach((r, i) => {
      r.addEventListener('click', () => pick(r, false));
      r.addEventListener('keydown', e => {
        const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); pick(radios[e.key === 'Home' ? 0 : radios.length - 1], true); }
        else if (d) { e.preventDefault(); pick(radios[(i + d + radios.length) % radios.length], true); }
      });
    });
  }
}

/* ---------- combobox ---------- */
let cur = null;

function bindCombo(cb, cfg) {
  cb.cfg = cfg;
  const tr = $('.cb-trigger', cb);
  tr.addEventListener('click', () => (cur && cur.cb === cb) ? closeCombo(true) : openCombo(cb));
  tr.addEventListener('keydown', e => onComboKey(e, cb));
}

function isSel(cfg, v) {
  const val = cfg.get();
  return Array.isArray(val) ? val.includes(v) : val === v;
}

function openCombo(cb) {
  closeCombo(false);
  const cfg = cb.cfg, tr = $('.cb-trigger', cb);
  const items = [
    ...cfg.options.map(o => ({ v: o, l: o })),
    ...(cfg.specials ? [{ v: UNK, l: SPECIAL[UNK], sp: true }, { v: NA, l: SPECIAL[NA], sp: true }] : [])
  ];
  const hasSearch = cfg.options.length > 7;
  const pop = document.createElement('div');
  pop.className = 'pop' + (cfg.compact ? ' pop-compact' : '');
  const name = cfg.labelId ? `aria-labelledby="${cfg.labelId}"` : `aria-label="${esc(cfg.label)}"`;
  pop.innerHTML = `${hasSearch ? `<div class="pop-search">${ic('search', 'sm')}<input type="text" role="combobox" aria-expanded="true" aria-controls="${cfg.id}-lb" aria-autocomplete="list" aria-label="Buscar en ${esc(cfg.label.toLowerCase())}" placeholder="Buscar" autocomplete="off" spellcheck="false"></div>` : ''}
    <p class="pop-empty" role="status" hidden></p>
    <ul class="lb" role="listbox" id="${cfg.id}-lb" ${name} ${cfg.multi ? 'aria-multiselectable="true"' : ''}></ul>`;
  cb.appendChild(pop);
  const list = $('.lb', pop);
  cur = { cb, cfg, tr, pop, list, items, vis: items, q: '', active: -1, keyEl: hasSearch ? $('input', pop) : tr };
  tr.setAttribute('aria-expanded', 'true');
  drawOptions();
  const si = cur.vis.findIndex(it => isSel(cfg, it.v));
  setActive(si >= 0 ? si : 0, true);

  list.addEventListener('pointerdown', e => e.preventDefault());
  list.addEventListener('click', e => { const li = e.target.closest('[role="option"]'); if (li) choose(+li.dataset.i); });
  list.addEventListener('mousemove', e => { const li = e.target.closest('[role="option"]'); if (li && +li.dataset.i !== cur.active) setActive(+li.dataset.i, false); });
  if (hasSearch) {
    const inp = cur.keyEl;
    inp.addEventListener('input', () => { cur.q = inp.value; drawOptions(); setActive(0, true); });
    inp.addEventListener('keydown', e => onComboKey(e, cb));
    inp.focus();
  }
  placePop();
}

function drawOptions() {
  const { cfg, items, list, pop } = cur;
  const q = norm(cur.q.trim());
  cur.vis = items.filter(it => it.sp || !q || norm(it.l).includes(q));
  const regular = cur.vis.filter(it => !it.sp).length;
  const empty = $('.pop-empty', pop);
  empty.hidden = !!regular || !q;
  if (!regular && q) empty.textContent = `Sin resultados para «${cur.q.trim()}»`;
  let firstSpDone = false;
  list.innerHTML = cur.vis.map((it, i) => {
    const sel = isSel(cfg, it.v);
    const first = it.sp && !firstSpDone && regular > 0; if (it.sp) firstSpDone = true;
    const box = cfg.multi && !it.sp ? `<span class="box">${ic('check')}</span>` : '';
    const tick = !cfg.multi || it.sp ? `<span class="tick">${ic('check', 'sm')}</span>` : '';
    return `<li role="option" id="${cfg.id}-o${i}" data-i="${i}" aria-selected="${sel}" class="opt${it.sp ? ' sp-opt' : ''}${first ? ' first-sp' : ''}">${box}<span class="ol">${esc(it.l)}</span>${tick}</li>`;
  }).join('');
  if (cur.active >= 0) setActive(Math.min(cur.active, cur.vis.length - 1), false);
}

function setActive(i, scroll) {
  if (!cur) return;
  cur.active = i;
  $$('.opt', cur.list).forEach(li => li.classList.toggle('active', +li.dataset.i === i));
  const li = $(`#${cur.cfg.id}-o${i}`);
  if (li) {
    cur.keyEl.setAttribute('aria-activedescendant', li.id);
    if (scroll) {
      const lt = li.offsetTop, lb = lt + li.offsetHeight, l = cur.list;
      if (lt < l.scrollTop) l.scrollTop = lt; else if (lb > l.scrollTop + l.clientHeight) l.scrollTop = lb - l.clientHeight;
    }
  } else cur.keyEl.removeAttribute('aria-activedescendant');
}

function placePop() {
  const sc = $('#scroll').getBoundingClientRect();
  const r = cur.pop.getBoundingClientRect(), t = cur.tr.getBoundingClientRect();
  if (r.bottom > sc.bottom - 8 && t.top - sc.top > r.height + 8) cur.pop.classList.add('up');
}

function choose(i) {
  const it = cur && cur.vis[i];
  if (!it) return;
  const cfg = cur.cfg;
  if (cfg.multi) {
    const v = cfg.get();
    if (it.sp) cfg.set(v === it.v ? [] : it.v);
    else {
      const arr = Array.isArray(v) ? v.slice() : [];
      const j = arr.indexOf(it.v);
      if (j >= 0) arr.splice(j, 1); else arr.push(it.v);
      arr.sort((a, b) => cfg.options.indexOf(a) - cfg.options.indexOf(b));
      cfg.set(arr);
    }
    $('.cb-val', cur.tr).innerHTML = displayHTML(cfg);
    drawOptions();
    setActive(i, false);
    updateMeta();
    return;
  }
  closeCombo(false);
  const focusSel = cfg.set(it.v) || `#${cfg.id}`;
  renderField(cfg.key, focusSel);
}

function closeCombo(focusTrigger) {
  if (!cur) return;
  const { tr, pop } = cur;
  pop.remove();
  tr.setAttribute('aria-expanded', 'false');
  tr.removeAttribute('aria-activedescendant');
  cur = null;
  if (focusTrigger) tr.focus();
}

function onComboKey(e, cb) {
  const open = cur && cur.cb === cb;
  const onInput = e.target.tagName === 'INPUT';
  if (!open) {
    if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) {
      e.preventDefault(); openCombo(cb);
      if (e.key === 'ArrowUp') setActive(cur.vis.length - 1, true);
    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && cb.cfg.options.length > 7) {
      e.preventDefault(); openCombo(cb);
      cur.keyEl.value = e.key; cur.keyEl.dispatchEvent(new Event('input'));
    }
    return;
  }
  const n = cur.vis.length;
  switch (e.key) {
    case 'ArrowDown': e.preventDefault(); setActive(Math.min(n - 1, cur.active + 1), true); break;
    case 'ArrowUp': e.preventDefault(); setActive(Math.max(0, cur.active - 1), true); break;
    case 'Home': if (!onInput) { e.preventDefault(); setActive(0, true); } break;
    case 'End': if (!onInput) { e.preventDefault(); setActive(n - 1, true); } break;
    case 'Enter': e.preventDefault(); if (cur.active >= 0) choose(cur.active); break;
    case ' ': if (!onInput) { e.preventDefault(); if (cur.active >= 0) choose(cur.active); } break;
    case 'Escape': e.preventDefault(); e.stopPropagation(); closeCombo(true); break;
    case 'Tab': if (onInput) { e.preventDefault(); closeCombo(true); } else closeCombo(false); break;
  }
}

document.addEventListener('pointerdown', e => { if (cur && !cur.cb.contains(e.target)) closeCombo(false); });
$('#scroll').addEventListener('scroll', () => { if (cur) { cur.pop.classList.remove('up'); placePop(); } }, { passive: true });

/* ---------- index, progress and save bar ---------- */
$('#ix-list').innerHTML = GROUPS.map(g => `<li><a class="ix" href="#sec-${g.id}" data-g="${g.id}"><span class="ix-name">${g.name}</span><span class="ix-st" id="ix-st-${g.id}"></span></a></li>`).join('');

let lockSpy = 0;
function setCurrent(id) {
  $$('.ix').forEach(a => a.dataset.g === id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'));
}
$$('.ix').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  const sec = $(`#sec-${a.dataset.g}`);
  lockSpy = Date.now() + 700;
  setCurrent(a.dataset.g);
  sec.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
  $('h3', sec).focus({ preventScroll: true });
}));
const scroller = $('#scroll');
function spy() {
  if (Date.now() < lockSpy) return;
  const top = scroller.getBoundingClientRect().top;
  let id = GROUPS[0].id;
  if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 4) id = GROUPS[GROUPS.length - 1].id;
  else GROUPS.forEach(g => { if ($(`#sec-${g.id}`).getBoundingClientRect().top - top <= 96) id = g.id; });
  setCurrent(id);
}
scroller.addEventListener('scroll', spy, { passive: true });

function updateMeta() {
  let total = 0;
  GROUPS.forEach(g => {
    const miss = g.fields.filter(isEmpty).length;
    total += miss;
    $(`#ix-st-${g.id}`).innerHTML = miss
      ? `<span class="ix-miss">falta ${miss}</span>`
      : `<span class="ix-ok">${ic('check', 'sm')}<span class="sr">Completo</span></span>`;
  });
  $$('.field[data-key]').forEach(el => el.classList.toggle('needs', !!FIELDS[el.dataset.key].req && isEmpty(el.dataset.key)));
  const pr = $('#progress');
  pr.className = 'badge ' + (total ? 'warning' : 'success');
  pr.textContent = total ? `Faltan ${total}` : 'Completo';

  const dirty = Object.keys(state).filter(k => JSON.stringify(state[k]) !== JSON.stringify(saved[k])).length;
  const st = $('#save-status');
  st.classList.toggle('dirty', dirty > 0);
  st.innerHTML = dirty
    ? `<span class="dot" aria-hidden="true"></span>${dirty} ${dirty === 1 ? 'cambio sin guardar' : 'cambios sin guardar'}`
    : `${ic('check', 'sm')}${savedLabel}`;
  $('#save').disabled = !dirty;
  $('#discard').disabled = !dirty;
}

$('#save').addEventListener('click', () => {
  saved = clone(state);
  savedLabel = 'Guardado justo ahora';
  updateMeta();
  $('#content-h').focus();
});
$('#discard').addEventListener('click', () => {
  closeCombo(false);
  state = clone(saved);
  renderSections();
  updateMeta();
  $('#content-h').focus();
});

$$('[data-noop]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
$$('.tabs a[aria-current]').forEach(a => a.addEventListener('click', e => e.preventDefault()));

/* ---------- artboard tools ---------- */
const themeBtn = $('#t-theme'), viewBtn = $('#t-view');
function paintTools() {
  const dark = document.documentElement.classList.contains('dark');
  const mobile = $('#stage').classList.contains('mobile');
  themeBtn.innerHTML = `${ic(dark ? 'moon' : 'sun', 'sm')}Tema: ${dark ? 'oscuro' : 'claro'}`;
  viewBtn.innerHTML = `${ic(mobile ? 'phone' : 'monitor', 'sm')}Vista: ${mobile ? 'móvil (390)' : 'escritorio'}`;
}
themeBtn.addEventListener('click', () => { document.documentElement.classList.toggle('dark'); paintTools(); });
viewBtn.addEventListener('click', () => { closeCombo(false); $('#stage').classList.toggle('mobile'); paintTools(); spy(); });

renderSections();
updateMeta();
paintTools();
setCurrent(GROUPS[0].id);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>HoundFe · Sistema de diseño</title>
<style>
  /* Tokens: src/core/shared/design-system/houndfe-theme.css */
  .hf-theme.light {
    --hf-page: #f5f6f8; --hf-surface: #ffffff; --hf-surface-muted: #e7eef7;
    --hf-field: #ffffff; --hf-field-border: #8593a3; --hf-ink: #24313d;
    --hf-heading: #173968; --hf-muted: #576574; --hf-border: #dce2e8;
    --hf-action: #2442f6; --hf-on-action: #ffffff; --hf-active: #2442f6;
    --hf-active-soft: #edf0ff; --hf-focus: #2442f6; --hf-gold: #f6bb13;
    --hf-gold-soft: #fff5d6; --hf-gold-ink: #443218; --hf-warning: #805511;
    --hf-warning-soft: #fff5d6; --hf-success: #236044; --hf-danger: #b42318;
    --hf-danger-soft: #fef3f2; --hf-danger-border: #f4b8b2;
  }
  .hf-theme.dark {
    --hf-page: #0e1520; --hf-surface: #192332; --hf-surface-muted: #202e43;
    --hf-field: #121d2c; --hf-field-border: #64758d; --hf-ink: #edf2fa;
    --hf-heading: #edf2fa; --hf-muted: #adbcd0; --hf-border: #354459;
    --hf-action: #91b0ff; --hf-on-action: #132344; --hf-active: #b3caff;
    --hf-active-soft: #223555; --hf-focus: #a6c1ff; --hf-gold: #f2c456;
    --hf-gold-soft: #3b311d; --hf-gold-ink: #f2cb71; --hf-warning: #f2cb71;
    --hf-warning-soft: #3b311d; --hf-success: #a2d9b9; --hf-danger: #ffb4ab;
    --hf-danger-soft: #3d2220; --hf-danger-border: #7a3f3b;
  }
  .hf-theme {
    --hf-font: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --hf-radius-card: 12px; --hf-radius-control: 6px; --hf-control-height: 44px;
    --hf-table-head: color-mix(in srgb, var(--hf-ink) 4%, var(--hf-surface));
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1440px; }
  .board { display: grid; grid-template-columns: 720px 720px; width: 1440px; }
  .hf-theme {
    width: 720px; padding: 32px 24px 32px; background: var(--hf-page); color: var(--hf-ink);
    font-family: var(--hf-font); font-size: 14px; line-height: 1.5;
    font-feature-settings: "cv11", "ss01", "tnum";
  }
  .hf-theme h1, .hf-theme h2, .hf-theme h3, .hf-theme p { margin: 0; }
  .sys-title { color: var(--hf-heading); font-size: 32px; font-weight: 600; line-height: 1.25; letter-spacing: -0.045em; }
  .sys-sub { max-width: 62ch; color: var(--hf-muted); font-size: 14px; line-height: 1.5; margin-top: 4px; }
  section { margin-top: 32px; }
  .sec-h { color: var(--hf-heading); font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .meta { color: var(--hf-muted); font-size: 13px; }
  .card { background: var(--hf-surface); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-card); padding: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  /* Color swatches */
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sw { display: flex; align-items: center; gap: 8px; padding: 8px; background: var(--hf-surface); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-control); min-width: 0; }
  .sw i { flex: none; width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--hf-border); }
  .sw b { display: block; font-size: 12px; font-weight: 600; color: var(--hf-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sw span { display: block; font-size: 12px; color: var(--hf-muted); }

  /* Type scale */
  .type { display: grid; grid-template-columns: 112px 1fr; align-items: baseline; gap: 4px 16px; }
  .type dt { color: var(--hf-muted); font-size: 12px; }
  .type dd { margin: 0; color: var(--hf-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Spacing, radius, shadow */
  .scale { display: flex; align-items: flex-end; gap: 12px; }
  .scale div { text-align: center; font-size: 12px; color: var(--hf-muted); }
  .scale i { display: block; background: var(--hf-action); margin: 0 auto 4px; height: 12px; border-radius: 2px; }
  .radii { display: flex; flex-wrap: wrap; gap: 12px; }
  .radii div { text-align: center; font-size: 12px; color: var(--hf-muted); }
  .radii i { display: block; width: 44px; height: 44px; margin-bottom: 4px; background: var(--hf-surface-muted); border: 1px solid var(--hf-field-border); }
  .shadow-box { width: 160px; height: 56px; display: grid; place-items: center; background: var(--hf-surface); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-card); box-shadow: 0 1px 2px color-mix(in srgb, var(--hf-ink) 5%, transparent); font-size: 12px; color: var(--hf-muted); }

  /* Status badge: houndfe-ui.css .hf-status-badge */
  .hf-status-badge { display: inline-flex; height: 24px; align-items: center; gap: 6px; padding-inline: 8px; border: 1px solid transparent; border-radius: var(--hf-radius-control); background-color: var(--hf-badge-bg); color: var(--hf-badge-fg); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
  .hf-status-badge[data-tone='neutral'] { --hf-badge-fg: var(--hf-muted); --hf-badge-bg: var(--hf-surface-muted); }
  .hf-status-badge[data-tone='info'] { --hf-badge-fg: var(--hf-active); --hf-badge-bg: var(--hf-active-soft); }
  .hf-status-badge[data-tone='success'] { --hf-badge-fg: var(--hf-success); --hf-badge-bg: color-mix(in srgb, var(--hf-success) 12%, var(--hf-surface)); }
  .hf-status-badge[data-tone='warning'] { --hf-badge-fg: var(--hf-warning); --hf-badge-bg: var(--hf-warning-soft); }
  .hf-status-badge[data-tone='danger'] { --hf-badge-fg: var(--hf-danger); --hf-badge-bg: var(--hf-danger-soft); }
  .hf-status-badge[data-urgent='true'] { background: color-mix(in srgb, var(--hf-badge-fg) 18%, var(--hf-surface)); border-color: color-mix(in srgb, var(--hf-badge-fg) 55%, var(--hf-surface)); }
  .dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background-color: currentColor; }
  .ico { width: 14px; height: 14px; flex: none; }
  .ico-24 { width: 24px; height: 24px; flex: none; }
  .ico-16 { width: 16px; height: 16px; flex: none; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .aviso { display: inline-flex; align-items: center; gap: 4px; color: var(--hf-warning); font-size: 12px; font-weight: 600; }

  /* Buttons: houndfe-ui.css .hf-primary-control */
  .btn { display: inline-flex; min-height: var(--hf-control-height); align-items: center; justify-content: center; gap: 6px; padding-inline: 16px; border: 1px solid transparent; border-radius: var(--hf-radius-control); font-family: var(--hf-font); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background-color: var(--hf-action); color: var(--hf-on-action); }
  .btn-outline { background-color: var(--hf-surface); color: var(--hf-ink); border-color: var(--hf-field-border); }
  .btn-ghost { background: transparent; color: var(--hf-muted); }
  .btn-disabled { border-color: var(--hf-border); background-color: var(--hf-surface-muted); color: var(--hf-muted); cursor: not-allowed; }
  .btn-icon { width: var(--hf-control-height); min-width: var(--hf-control-height); padding: 0; }
  .btn:focus-visible, .field:focus-visible, .link:focus-visible { outline: 2px solid var(--hf-focus); outline-offset: 2px; }
  .btn.is-focus { outline: 2px solid var(--hf-focus); outline-offset: 2px; }
  .link { color: var(--hf-action); text-decoration: underline; }

  /* Inputs */
  .fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  label.lbl { display: block; margin-bottom: 4px; color: var(--hf-ink); font-size: 14px; font-weight: 500; }
  .field { width: 100%; min-height: var(--hf-control-height); padding: 0 12px; border: 1px solid var(--hf-field-border); border-radius: var(--hf-radius-control); background-color: var(--hf-field); color: var(--hf-ink); font-family: var(--hf-font); font-size: 14px; }
  .field::placeholder { color: var(--hf-muted); }
  .field.is-focus { outline: 2px solid var(--hf-focus); outline-offset: 2px; }
  .field.is-error { border-color: var(--hf-danger); outline: 2px solid var(--hf-danger); outline-offset: 0; }
  .err { margin-top: 4px; color: var(--hf-danger); font-size: 13px; }

  /* Table: houndfe-ui.css .hf-table-surface / .hf-data-table */
  .surface { background-color: var(--hf-surface); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-card); box-shadow: 0 1px 2px color-mix(in srgb, var(--hf-ink) 5%, transparent); overflow: hidden; }
  table.dt { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 14px; }
  .dt thead { background-color: var(--hf-table-head); }
  .dt th { height: 40px; padding-inline: 12px; color: var(--hf-muted); font-size: 13px; font-weight: 600; text-align: left; white-space: nowrap; }
  .dt td { height: 64px; padding: 10px 12px; vertical-align: middle; border-top: 1px solid var(--hf-border); overflow: hidden; text-overflow: ellipsis; }
  .dt .num { text-align: right; font-variant-numeric: tabular-nums; }
  .dt .col-act { width: 64px; padding-inline: 8px; text-align: right; overflow: visible; }
  .dt .col-stat { width: 128px; white-space: nowrap; overflow: visible; }
  .dt .col-num { width: 112px; }
  .dt tr.pending td { background-color: var(--hf-warning-soft); }
  .dt tr.hover td { background-color: color-mix(in srgb, var(--hf-surface-muted) 45%, var(--hf-surface)); }
  .row-primary { display: block; overflow: hidden; color: var(--hf-heading); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .row-secondary { display: block; margin-top: 2px; overflow: hidden; color: var(--hf-muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
  .missing { display: inline-flex; align-items: center; gap: 4px; color: var(--hf-warning); font-weight: 600; }
  .menu { width: 288px; margin-top: 8px; margin-left: auto; padding: 4px; background: var(--hf-surface); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-card); box-shadow: 0 1px 2px color-mix(in srgb, var(--hf-ink) 5%, transparent); }
  .menu .item { display: flex; align-items: center; gap: 8px; min-height: var(--hf-control-height); padding: 0 12px; border-radius: var(--hf-radius-control); color: var(--hf-ink); font-weight: 500; }
  .menu .item.hl { background-color: var(--hf-surface-muted); }
  .menu .item.danger { color: var(--hf-danger); }
  .menu hr { margin: 4px 0; border: 0; border-top: 1px solid var(--hf-border); }
  .tb { display: flex; align-items: center; gap: 8px; padding: 12px; }
  .tb .field { max-width: 360px; }
  .tb .spacer { flex: 1; }
  /* Premium table layout: houndfe-ui.css .hf-th-* / .hf-pin-edge-* / .hf-columns-* / .hf-density */
  .dt th.th-hover { position: relative; }
  .th-grip { position: absolute; top: 50%; left: 0; display: grid; place-items: center; width: 12px; height: 24px; transform: translateY(-50%); color: var(--hf-muted); }
  .th-menu { position: absolute; top: 50%; right: 2px; display: grid; place-items: center; width: 28px; height: 32px; transform: translateY(-50%); border-radius: 4px; background-color: color-mix(in srgb, var(--hf-ink) 8%, var(--hf-table-head)); color: var(--hf-ink); }
  .th-pin { width: 13px; height: 13px; margin-left: 4px; vertical-align: -2px; color: var(--hf-active); }
  .th-resize { position: absolute; top: 8px; right: 0; bottom: 8px; width: 2px; border-radius: 2px; background-color: var(--hf-border); }
  .dt .pin-edge { background-color: var(--hf-surface); box-shadow: inset -1px 0 0 var(--hf-border), 8px 0 8px -6px color-mix(in srgb, var(--hf-ink) 14%, transparent); }
  .dt th.pin-edge { background-color: var(--hf-table-head); }
  .dt tr.hover td.pin-edge { background-color: color-mix(in srgb, var(--hf-surface-muted) 45%, var(--hf-surface)); }
  .dt tr.pending td.pin-edge { background-color: var(--hf-warning-soft); }
  .cols { width: 372px; margin-top: 8px; margin-left: auto; padding: 8px 0; background: var(--hf-surface); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-card); box-shadow: 0 1px 2px color-mix(in srgb, var(--hf-ink) 5%, transparent); }
  .cols-title { padding: 0 16px; color: var(--hf-heading); font-size: 16px; font-weight: 600; }
  .cols-sec { display: flex; justify-content: space-between; padding: 4px 16px; color: var(--hf-muted); font-size: 12px; font-weight: 600; }
  .density { display: flex; gap: 2px; height: var(--hf-control-height); margin: 0 16px 12px; padding: 3px; border: 1px solid var(--hf-border); border-radius: var(--hf-radius-control); background-color: var(--hf-surface); }
  .density span { display: inline-flex; flex: 1 1 0; align-items: center; justify-content: center; border-radius: 4px; color: var(--hf-muted); font-size: 13px; font-weight: 500; }
  .density span[aria-checked='true'] { background-color: var(--hf-active-soft); color: var(--hf-active); font-weight: 600; }
  .cols-body { padding: 8px 8px 0; border-top: 1px solid var(--hf-border); }
  .cols-row { display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px; border-radius: 6px; }
  .cols-row .lbl { flex: 1; font-weight: 500; }
  .cols-pin { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 6px; color: var(--hf-muted); }
  .cols-pin.on { border-color: color-mix(in srgb, var(--hf-active) 35%, transparent); background-color: var(--hf-active-soft); color: var(--hf-active); }
  .sw-on { width: 32px; height: 18px; border-radius: 9px; background-color: var(--hf-action); position: relative; }
  .sw-on::after { content: ''; position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background-color: var(--hf-on-action); }
  .cols-note { padding: 8px 16px 0; color: var(--hf-muted); font-size: 13px; }

  /* Empty state: houndfe-ui.css .hf-empty-state */
  .empties { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hf-empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 8rem; padding: 40px 16px; text-align: center; background: var(--hf-surface); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-card); }
  .hf-empty-state svg { color: var(--hf-muted); }
  .hf-empty-state h3 { font-size: 15px; font-weight: 600; color: var(--hf-heading); }
  .hf-empty-state p { max-width: 28rem; font-size: 13px; color: var(--hf-muted); }
  .hf-empty-state .btn { margin-top: 8px; }
  .hf-empty-state[data-kind='error'] { background-color: var(--hf-danger-soft); border-color: var(--hf-danger-border); }
  .hf-empty-state[data-kind='error'] svg, .hf-empty-state[data-kind='error'] h3 { color: var(--hf-danger); }

  /* Cards */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .mcard { position: relative; }
  .mcard .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .mcard .top .btn-icon { margin: -8px -8px 0 0; }
  .mcard .badges { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .mcard .foot { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hf-border); font-size: 13px; color: var(--hf-muted); font-variant-numeric: tabular-nums; }
  .stat .lbl2 { color: var(--hf-muted); font-size: 13px; }
  .stat .big { margin-top: 4px; color: var(--hf-heading); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .check { margin-top: 12px; padding: 12px; background-color: var(--hf-surface-muted); border: 1px solid var(--hf-border); border-radius: var(--hf-radius-card); font-size: 13px; }
  .check .it { display: flex; align-items: center; gap: 8px; color: var(--hf-warning); font-weight: 600; }
  .check .it a { margin-left: auto; font-weight: 400; }

  /* Detail header */
  .dh-meta { display: flex; align-items: center; gap: 8px; color: var(--hf-muted); font-size: 13px; }
  .dh-title { margin-top: 4px; overflow: hidden; color: var(--hf-heading); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; text-overflow: ellipsis; }
  .dh { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .dh-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .steps { display: flex; align-items: center; margin: 16px 0 0; padding: 0; list-style: none; font-size: 13px; font-weight: 600; }
  .steps li { display: flex; align-items: center; gap: 8px; color: var(--hf-muted); }
  .steps li + li::before { content: ''; width: 24px; height: 1px; margin-inline: 8px; background-color: var(--hf-border); }
  .steps .c { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--hf-field-border); font-size: 12px; }
  .steps .done .c { background-color: var(--hf-success); border-color: var(--hf-success); color: var(--hf-surface); }
  .steps .done { color: var(--hf-ink); }
  .steps .current .c { background-color: var(--hf-action); border-color: var(--hf-action); color: var(--hf-on-action); }
  .steps .current { color: var(--hf-heading); }
  .steps .count { color: var(--hf-warning); font-weight: 500; }
  .foot-save { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hf-border); font-size: 13px; }
  .foot-save .ok { color: var(--hf-success); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<main class="board">

<template id="panel">
  <header>
    <h1 class="sys-title" data-label></h1>
    <p class="sys-sub">Tokens --hf-* y componentes base de HoundFe. Fuente de cada valor en design/system.md.</p>
  </header>

  <section aria-label="Colores">
    <h2 class="sec-h">Colores · --hf-*</h2>
    <div class="swatches" data-swatches></div>

  <section aria-label="Tipografía">

<script>
  /* Builds the same panel twice (light, dark) and fills each swatch with its resolved token value. */
  var tokens = ['page','surface','surface-muted','field','field-border','ink','heading','muted','border','action','on-action','active','active-soft','focus','gold','gold-soft','gold-ink','warning','warning-soft','success','danger','danger-soft','danger-border'];
  var board = document.querySelector('.board');
  var tpl = document.getElementById('panel');
  ['light', 'dark'].forEach(function (mode) {
    var panel = document.createElement('div');
    panel.className = 'hf-theme ' + mode;
    panel.appendChild(tpl.content.cloneNode(true));
    panel.querySelector('[data-label]').textContent = mode === 'light' ? 'HoundFe · Claro' : 'HoundFe · Oscuro';
    board.appendChild(panel);
    var cs = getComputedStyle(panel);
    var wrap = panel.querySelector('[data-swatches]');
    tokens.forEach(function (t) {
      var d = document.createElement('div');
      d.className = 'sw';
      var chip = document.createElement('i');
      chip.style.background = 'var(--hf-' + t + ')';
      var box = document.createElement('div');
      box.style.minWidth = '0';
      var b = document.createElement('b');
      b.textContent = '--hf-' + t;
      var v = document.createElement('span');
      v.textContent = cs.getPropertyValue('--hf-' + t).trim();
      box.appendChild(b); box.appendChild(v);
      d.appendChild(chip); d.appendChild(box);
      wrap.appendChild(d);
    });
  });
</script>
<noscript><p style="font-family:ui-sans-serif,system-ui,sans-serif;padding:24px">Este tablero necesita JavaScript para repetir el panel en claro y oscuro.</p></noscript>

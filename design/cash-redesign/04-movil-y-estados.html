<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoundFe · Caja · 04-movil-y-estados</title>
<style>
/* Caja redesign: shared tokens and components. Every value comes from design/system.md
   (houndfe-theme.css, houndfe-ui.css, main.css). Source only: build.sh inlines it into each artboard. */
:root,[data-theme="light"]{
--hf-page:#f5f6f8;--hf-surface:#ffffff;--hf-surface-muted:#e7eef7;--hf-field:#ffffff;--hf-field-border:#8593a3;
--hf-ink:#24313d;--hf-heading:#173968;--hf-muted:#576574;--hf-border:#dce2e8;
--hf-action:#2442f6;--hf-on-action:#ffffff;--hf-active:#2442f6;--hf-active-soft:#edf0ff;--hf-focus:#2442f6;
--hf-gold:#f6bb13;--hf-gold-soft:#fff5d6;--hf-gold-ink:#443218;
--hf-warning:#805511;--hf-warning-soft:#fff5d6;--hf-success:#236044;
--hf-danger:#b42318;--hf-danger-soft:#fef3f2;--hf-danger-border:#f4b8b2;
}
[data-theme="dark"]{
--hf-page:#0e1520;--hf-surface:#192332;--hf-surface-muted:#202e43;--hf-field:#121d2c;--hf-field-border:#64758d;
--hf-ink:#edf2fa;--hf-heading:#edf2fa;--hf-muted:#adbcd0;--hf-border:#354459;
--hf-action:#91b0ff;--hf-on-action:#132344;--hf-active:#b3caff;--hf-active-soft:#223555;--hf-focus:#a6c1ff;
--hf-gold:#f2c456;--hf-gold-soft:#3b311d;--hf-gold-ink:#f2cb71;
--hf-warning:#f2cb71;--hf-warning-soft:#3b311d;--hf-success:#a2d9b9;
--hf-danger:#ffb4ab;--hf-danger-soft:#3d2220;--hf-danger-border:#7a3f3b;
}
:root{
--hf-font:'Geist',ui-sans-serif,system-ui,sans-serif;
--hf-radius-card:12px;--hf-radius-control:6px;--hf-control-height:44px;
--table-head:color-mix(in srgb,var(--hf-ink) 4%,var(--hf-surface));
--row-hover:color-mix(in srgb,var(--hf-surface-muted) 45%,var(--hf-surface));
--success-soft:color-mix(in srgb,var(--hf-success) 12%,var(--hf-surface));
--skel:color-mix(in srgb,var(--hf-ink) 16%,var(--hf-surface));
--shadow-soft:0 1px 2px color-mix(in srgb,var(--hf-ink) 5%,transparent);
--shadow-pop:0 12px 32px color-mix(in srgb,var(--hf-ink) 16%,transparent);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--hf-page);color:var(--hf-ink);font-family:var(--hf-font);font-size:14px;line-height:1.5;font-feature-settings:"cv11","ss01","tnum"}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s14{width:14px;height:14px}svg.i.s20{width:20px;height:20px}svg.i.s24{width:24px;height:24px}
.fig{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--hf-focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* App chrome (simplified unified shell) */
.app{width:1440px;height:900px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:56px 1fr;overflow:hidden;background:var(--hf-page)}
.chrome{display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--hf-surface);border-bottom:1px solid var(--hf-border)}
.brand{display:flex;align-items:center;gap:8px;color:var(--hf-heading);font-weight:600}
.brand b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--hf-gold-soft);color:var(--hf-gold-ink);box-shadow:inset 0 0 0 1px var(--hf-gold);font-size:13px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--hf-muted);font-size:13px}
.crumbs a{color:var(--hf-muted);text-decoration:none}
.crumbs [aria-current]{color:var(--hf-ink);font-weight:500}
.chrome .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--hf-muted)}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:9999px;background:var(--hf-surface-muted);color:var(--hf-heading);font-size:12px;font-weight:600}

/* Type */
.page-title{color:var(--hf-heading);font-size:28px;font-weight:600;line-height:1.25;letter-spacing:-0.045em}
.page-sub{color:var(--hf-muted);font-size:14px;max-width:62ch}
.h-detail{color:var(--hf-heading);font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.3}
.h-sec{color:var(--hf-heading);font-size:16px;font-weight:600}
.meta{color:var(--hf-muted);font-size:13px}
.small{font-size:12px}
.strong{font-weight:600}
.money{font-variant-numeric:tabular-nums;font-weight:600;color:var(--hf-heading)}
.big-money{font-variant-numeric:tabular-nums;font-weight:600;color:var(--hf-heading);font-size:22px;letter-spacing:-0.02em}

/* Surfaces */
.card{background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:var(--hf-radius-card)}
.pad{padding:16px}.pad-l{padding:24px}
.muted-panel{background:var(--hf-surface-muted);border:1px solid var(--hf-border);border-radius:var(--hf-radius-card);padding:12px 16px;font-size:13px}
.hr{height:1px;background:var(--hf-border);border:0;margin:16px 0}
.stack{display:grid;gap:16px}.stack-s{display:grid;gap:8px}.stack-m{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:var(--hf-radius-control);font-size:14px;font-weight:600;cursor:pointer;background:transparent;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--hf-action);color:var(--hf-on-action)}
.btn-outline{background:var(--hf-surface);color:var(--hf-ink);border-color:var(--hf-field-border)}
.btn-ghost{color:var(--hf-ink)}
.btn-ghost:hover,.btn-outline:hover{background:var(--row-hover)}
.btn[aria-disabled="true"],.btn:disabled{background:var(--hf-page);color:var(--hf-muted);border-color:var(--hf-border);cursor:not-allowed}
[data-theme="dark"] .btn[aria-disabled="true"],[data-theme="dark"] .btn:disabled{color:color-mix(in srgb,var(--hf-muted) 60%,var(--hf-page))}
.btn-danger-text{color:var(--hf-danger)}
.btn-block{width:100%}
.btn-confirmed{background:var(--success-soft);color:var(--hf-success);border-color:color-mix(in srgb,var(--hf-success) 40%,var(--hf-surface))}
.link{color:var(--hf-action);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-weight:500}

/* Fields */
.field{display:grid;gap:4px}
.field>label,.lbl{color:var(--hf-ink);font-size:14px;font-weight:500}
.hint{color:var(--hf-muted);font-size:13px}
.input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--hf-border);border-radius:var(--hf-radius-control);background:var(--hf-field);color:var(--hf-ink);font-size:14px}
.input:hover{border-color:var(--hf-field-border)}
.input::placeholder{color:var(--hf-muted);opacity:1}
.input:focus{outline:2px solid var(--hf-focus);outline-offset:2px}
textarea.input{min-height:72px;padding:10px 12px;resize:vertical}
.money-input{position:relative;display:flex;align-items:center}
.money-input .cur{position:absolute;left:12px;color:var(--hf-muted);font-weight:500;pointer-events:none}
.money-input .unit{position:absolute;right:12px;color:var(--hf-muted);font-size:12px;font-weight:600;pointer-events:none}
.money-input .input{padding-left:26px;padding-right:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--hf-heading)}
.money-input.lg .input{min-height:56px;font-size:22px}
.field.invalid .input{border-color:var(--hf-danger)}
.err{display:flex;align-items:flex-start;gap:6px;color:var(--hf-danger);font-size:13px;font-weight:500}
.err svg{margin-top:2px}
.select{appearance:none;background-image:none}

/* Error summary (one per form, linked to fields) */
.err-summary{border:1px solid var(--hf-danger-border);background:var(--hf-danger-soft);border-radius:var(--hf-radius-card);padding:12px 16px}
.err-summary h3{display:flex;align-items:center;gap:8px;color:var(--hf-danger);font-size:14px;font-weight:600}
.err-summary ul{margin-top:4px;padding-left:24px;list-style:disc;color:var(--hf-danger);font-size:13px}
.err-summary a{color:var(--hf-danger)}

/* Status badge */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:600;line-height:1;white-space:nowrap;background:var(--bb);color:var(--bf)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.noicon::before{display:none}
.t-neutral{--bf:var(--hf-muted);--bb:var(--hf-surface-muted)}
.t-info{--bf:var(--hf-active);--bb:var(--hf-active-soft)}
.t-success{--bf:var(--hf-success);--bb:var(--success-soft)}
.t-warning{--bf:var(--hf-warning);--bb:var(--hf-warning-soft)}
.t-danger{--bf:var(--hf-danger);--bb:var(--hf-danger-soft)}

/* Radio cards / selectable rows / segmented / switch (DS «Selección sin checkboxes») */
.rcards{display:grid;gap:8px}
.rcard{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;padding:12px 16px;text-align:left;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:12px;cursor:pointer}
.rcard:hover{border-color:var(--hf-field-border)}
.rcard[aria-checked="true"]{background:var(--hf-active-soft);border-color:var(--hf-active)}
.rcard[aria-checked="true"] .rc-title{color:var(--hf-active)}
.rcard[aria-disabled="true"]{cursor:not-allowed;background:var(--hf-page)}
.rc-title{display:block;color:var(--hf-heading);font-weight:600}
.rc-desc{display:block;color:var(--hf-muted);font-size:13px}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;margin-top:0;border-radius:9999px;box-shadow:inset 0 0 0 1.5px var(--hf-muted);color:var(--hf-on-action)}
.mark svg{width:14px;height:14px;opacity:0}
[aria-checked="true"]>.mark{background:var(--hf-active);box-shadow:none}
[aria-checked="true"]>.mark svg{opacity:1}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--hf-surface-muted);border-radius:8px}
.seg button{min-height:40px;padding:0 16px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--hf-muted);font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--hf-surface);border-color:var(--hf-border);color:var(--hf-heading);font-weight:600}

/* Plain table */
.ptable{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.ptable th{height:40px;padding:0 12px;background:var(--table-head);color:var(--hf-muted);font-size:13px;font-weight:600;text-align:left;white-space:nowrap}
.ptable td{height:44px;padding:6px 12px;border-top:1px solid var(--hf-border)}
.ptable .num{text-align:right;font-variant-numeric:tabular-nums}
.ptable tfoot td{font-weight:600;color:var(--hf-heading);background:var(--table-head)}
.ptable tr.pending td{background:var(--hf-warning-soft)}

/* Inline notices */
.notice{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.notice svg{margin-top:2px}
.notice.warn{color:var(--hf-warning);font-weight:600}
.notice.info{color:var(--hf-muted)}
.callout{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid var(--hf-border);background:var(--hf-surface-muted);font-size:13px}
.callout svg{margin-top:2px;color:var(--hf-heading)}
.callout.warn{background:var(--hf-warning-soft);border-color:color-mix(in srgb,var(--hf-warning) 35%,var(--hf-surface))}
.callout.warn svg{color:var(--hf-warning)}
.callout.ok{background:var(--success-soft);border-color:color-mix(in srgb,var(--hf-success) 35%,var(--hf-surface))}
.callout.ok svg{color:var(--hf-success)}
.callout b{color:var(--hf-heading)}

/* Checklist (requirements) */
.checklist{display:grid;gap:2px}
.checklist li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:14px}
.checklist .ck{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:9999px}
.checklist .ck svg{width:13px;height:13px}
.ck.done{background:var(--hf-success);color:var(--hf-surface)}
.ck.todo{box-shadow:inset 0 0 0 1.5px var(--hf-warning);color:var(--hf-warning)}
.ck.wait{box-shadow:inset 0 0 0 1.5px var(--hf-muted);color:var(--hf-muted)}
.checklist .ck-t{display:block;font-weight:500}
.checklist .ck-d{display:block;color:var(--hf-muted);font-size:13px}

/* Denominations grid */
.denoms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px}
.denom{display:grid;grid-template-columns:72px 96px 1fr;align-items:center;gap:8px}
.denom .dv{font-weight:600;color:var(--hf-heading);font-variant-numeric:tabular-nums}
.denom .dv small{display:block;color:var(--hf-muted);font-weight:400;font-size:12px}
.denom .input{text-align:right;font-variant-numeric:tabular-nums;min-height:40px}
.denom .sub{text-align:right;color:var(--hf-ink);font-variant-numeric:tabular-nums}
.denom-total{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:12px;background:var(--hf-surface-muted)}

/* Skeleton */
.skel{background:var(--skel);border-radius:6px}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:8rem;padding:40px 16px;text-align:center}
.empty svg{width:24px;height:24px;color:var(--hf-muted)}
.empty h3{color:var(--hf-heading);font-size:15px;font-weight:600}
.empty p{color:var(--hf-muted);font-size:13px;max-width:28rem}
.empty.error{background:var(--hf-danger-soft);border:1px solid var(--hf-danger-border);border-radius:12px}
.empty.error svg,.empty.error h3{color:var(--hf-danger)}

/* Toast */
.toast{display:flex;gap:12px;align-items:flex-start;width:360px;padding:16px;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:12px;box-shadow:var(--shadow-pop)}
.toast .tile{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--success-soft);color:var(--hf-success)}
.toast b{display:block;color:var(--hf-heading);font-size:14px}
.toast span{color:var(--hf-muted);font-size:13px}

/* Demo control (outside the product UI) */
.demo{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:8px;padding:8px;background:var(--hf-surface);border:1px solid var(--hf-field-border);border-radius:12px;box-shadow:var(--shadow-pop);font-size:12px}
.demo .dl{color:var(--hf-muted);font-weight:600;padding:0 4px}
.demo select{min-height:36px;padding:0 8px;border:1px solid var(--hf-border);border-radius:6px;background:var(--hf-field);color:var(--hf-ink);font-size:12px}
.demo .seg button{min-height:32px;padding:0 10px;font-size:12px}

/* Layout helpers used by the shared panels; they reflow inside narrow containers (390 board) */
.panel-host{container-type:inline-size}
.rcards.cols-2{grid-template-columns:1fr 1fr}
.grid-amt{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.kv dt{color:var(--hf-muted);font-size:13px}
.kv dd{color:var(--hf-ink);font-weight:500}
.ho{display:grid;border:1px solid var(--hf-border);border-radius:12px;overflow:hidden;background:var(--hf-surface)}
.ho-row{display:grid;grid-template-columns:1.2fr 1.3fr 180px auto;gap:12px;align-items:center;padding:12px 16px}
.ho-row+.ho-row{border-top:1px solid var(--hf-border)}
@container (max-width:720px){
  .grid-4{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr 1fr}
}
@container (max-width:480px){
  .rcards.cols-2,.grid-amt,.grid-4{grid-template-columns:1fr}
  .denoms{grid-template-columns:1fr}
  .ho-row{grid-template-columns:1fr;gap:8px}
  .ho-row .money,.ho-row>div:last-child{text-align:left!important}
  .between{flex-wrap:wrap}
  .btn-primary,.btn-outline{flex:1 1 100%}
}
.twrap{overflow-x:auto}
.twrap:focus-visible{outline-offset:2px}
@container (max-width:480px){
  .ptable{font-size:13px}
  .ptable th,.ptable td{padding-inline:8px;white-space:nowrap}
  .ptable{min-width:440px}
}
.rcard[aria-disabled="true"] .rc-title{color:var(--hf-muted)}
/* 04 · mobile frames and states */
body{width:1440px}
.board{width:1440px;padding:32px 40px 96px;display:grid;gap:24px}
.board-h{display:grid;gap:4px}
.board-sec{margin-bottom:12px}
.ph-grid{display:grid;grid-template-columns:repeat(3,390px);justify-content:space-between;gap:32px 0}
.ph-wrap{display:grid;gap:8px;align-content:start}
.ph-cap{color:var(--hf-muted);font-size:13px;font-weight:600}
.phone{position:relative;width:390px;height:844px;display:grid;grid-template-rows:1fr auto;overflow:hidden;background:var(--hf-page);border:1px solid var(--hf-border);border-radius:28px;box-shadow:var(--shadow-soft)}
.ph-scroll{overflow:auto;min-height:0}
.tile{width:390px;min-height:520px;padding:16px;background:var(--hf-page);border:1px solid var(--hf-border);border-radius:28px;display:grid;align-content:start;gap:12px;container-type:inline-size}
.m-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 4px;background:var(--hf-surface);border-bottom:1px solid var(--hf-border)}
.m-ib{width:44px;padding:0}
.m-title{flex:1;color:var(--hf-heading);font-size:17px;font-weight:600}
.m-pad{padding:16px}
.m-shift{display:grid;gap:4px}
.m-shift .h-detail{font-size:17px}
.next-m{display:grid;gap:4px;padding:12px 16px;border-radius:12px;background:var(--hf-surface);border:1px solid var(--hf-active);box-shadow:inset 4px 0 0 var(--hf-action)}
.next-k{color:var(--hf-muted);font-size:12px;font-weight:600}
.m-recv{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;padding:12px 16px}
.m-tl{display:grid;background:var(--hf-surface);border:1px solid var(--hf-border);border-radius:12px;overflow:hidden}
.m-tl-i+.m-tl-i{border-top:1px solid var(--hf-border)}
.m-tl-a{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;color:inherit;text-decoration:none}
.m-tl-t{display:block;font-weight:600;color:var(--hf-heading);font-size:14px}
.is-upcoming .m-tl-t{font-weight:500;color:var(--hf-ink)}
.tl-dot{display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:9999px;background:var(--hf-surface);box-shadow:inset 0 0 0 2px var(--hf-field-border);color:var(--hf-muted)}
.tl-dot.done{background:var(--hf-success);box-shadow:none;color:var(--hf-surface)}
.tl-dot.cur{background:var(--hf-action);box-shadow:0 0 0 3px var(--hf-active-soft)}
.tl-dot.nxt{box-shadow:inset 0 0 0 2px var(--hf-action);background:var(--hf-active-soft)}
.tl-dot.blk{box-shadow:inset 0 0 0 2px var(--hf-warning);color:var(--hf-warning)}
.m-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px;background:var(--hf-surface);border-top:1px solid var(--hf-border)}
.m-bar .btn{padding:0 8px}
.ctx-kv{display:grid;gap:10px}
.ctx-kv div{display:flex;justify-content:space-between;gap:12px}
.ctx-kv dt{color:var(--hf-muted);font-size:13px}
.hidden-amt{display:inline-flex;align-items:center;gap:6px;color:var(--hf-muted);font-size:13px;font-weight:500}
.phone .denom{grid-template-columns:64px 80px 1fr}
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px">Este tablero necesita JavaScript para mostrar las pantallas.</p></noscript>
<script>
(() => {
/* Caja redesign — shared data (es-MX demo data), state model and task panels.
   Every direction composes these panels in its own layout. Data is illustrative, never a real tenant. */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mx = n => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mxs = n => (n > 0 ? '+' : '') + mx(n);

const WHO = { cajera: 'Cajera', super: 'Supervisor', destinatarios: 'Quien recibe', todos: 'Consulta' };
function stepState(st) {
  if (st.done && at(st.done)) return 'done';
  if (st.id === 'corte') return at('cerrada') ? 'current' : 'upcoming';
  if (st.id === 'movimientos') return S.stage === 'abierta' ? 'current' : 'upcoming';
  if (st.id === 'conteo') return S.stage === 'congelada' ? 'current' : S.stage === 'abierta' ? 'next' : 'upcoming';
  if (st.id === 'liberar') return S.stage === 'entregada' ? 'blocked' : 'upcoming';
  return S.stage === st.from ? 'current' : 'upcoming';
}
const stepTime = { apertura: 'open', conteo: 'declared', verificacion: 'verified', entrega: 'handed', liberar: 'released', recepcion: 'released', cierre: 'closed' };
function stepMeta(st) {
  const s = stepState(st), t = D.times[stepTime[st.id]];
  const by = { apertura: 'Laura Méndez', conteo: 'Laura Méndez', verificacion: 'Andrés Salazar', entrega: 'Laura Méndez', liberar: 'Laura Méndez', recepcion: '2 de 2 recibidas', cierre: 'Andrés Salazar' }[st.id];
  if (s === 'done') return t ? `${t} · ${by}` : 'Hecho';
  if (st.id === 'movimientos' && s === 'current') return blind() ? `En curso desde ${D.times.open} · ventas y totales ocultos hasta declarar` : `En curso desde ${D.times.open} · 5 movimientos visibles para auditoría`;
  if (st.id === 'movimientos' && at('congelada')) return `Terminó a las ${D.times.count}`;
  if (st.id === 'conteo' && s === 'next') return 'Cuando termines de vender';
  if (st.id === 'conteo' && S.stage === 'congelada') return `Congelada a las ${D.times.count} · falta declarar`;
  if (st.id === 'recepcion' && S.stage === 'entregada') return '0 de 2 recibidas';
  if (st.id === 'liberar' && s === 'blocked') return 'Se habilita cuando se reciban las 2 entregas';
  if (s === 'current' && st.who === 'super' && isCajera()) return 'Lo hace otra persona con permiso; no puedes ser tú';
  if (st.id === 'cierre' && s === 'upcoming') return 'Supervisor, después de liberar el cajón';
  return WHO[st.who];
}

function onAct(a) {
  if (a.startsWith('reg:')) S.register = a.slice(4);
  else if (a.startsWith('fund:')) { S.fundChoice = a.slice(5); S.fundConfirmed = false; }
  else if (a.startsWith('mov:')) S.movKind = a.slice(4);
  else if (a === 'confirm') { S.fundConfirmed = !S.fundConfirmed; S.showErrors = false; }
  else if (a === 'open-err') S.showErrors = true;
  else if (a === 'open') { S.stage = 'abierta'; S.view = 'inicio'; S.showErrors = false; }
  else if (a === 'move') S.lastMove = `Salida de $350.00 registrada a las 15:12 · Compra de bolsas para mostrador`;
  else if (a === 'freeze') S.stage = 'congelada';
  else if (a === 'declare') S.stage = 'declarada';
  else if (a === 'verify') S.stage = 'verificada';
  else if (a === 'handover') S.stage = 'entregada';
  else if (a === 'receive') S.stage = 'liberada';
  else if (a === 'close') S.stage = 'cerrada';
  else if (a === 'note' || a === 'pdf' || a === 'release') return;
}

  return `<div class="demo" role="region" aria-label="Controles de la demostración (no son parte de la interfaz)">
    <span class="dl">Demostración</span>
    <div class="seg" role="radiogroup" aria-label="Persona"><button type="button" role="radio" aria-checked="${S.role === 'cajera'}" data-demo="role:cajera">Cajera</button><button type="button" role="radio" aria-checked="${S.role === 'super'}" data-demo="role:super">Supervisor</button></div>
    <label class="sr" for="demo-stage">Momento del turno</label>
    <select id="demo-stage" data-demo-stage>${STAGES.map(s => `<option value="${s}" ${S.stage === s ? 'selected' : ''}>${STAGE_LABEL[s]}</option>`).join('')}</select>
    <div class="seg" role="radiogroup" aria-label="Tema"><button type="button" role="radio" aria-checked="${S.theme === 'light'}" data-demo="theme:light">Claro</button><button type="button" role="radio" aria-checked="${S.theme === 'dark'}" data-demo="theme:dark">Oscuro</button></div>
  </div>`;
}
function wire(render) {
  document.addEventListener('click', e => {
    const d = e.target.closest('[data-demo]');
    if (d) { const [k, v] = d.dataset.demo.split(':'); S[k] = v; if (k === 'role') S.view = 'inicio'; render(); return; }
    const a = e.target.closest('[data-act]');
    if (a && a.getAttribute('aria-disabled') !== 'true') { onAct(a.dataset.act); render(); if (a.dataset.act === 'open-err') $('.err-summary')?.focus(); return; }
    const v = e.target.closest('[data-view]');
    if (v && v.getAttribute('aria-disabled') !== 'true') { S.view = v.dataset.view; render(); const h = $('[data-focus-title]'); h && h.focus(); }
  });
  document.addEventListener('change', e => { if (e.target.matches('[data-demo-stage]')) { S.stage = e.target.value; S.fundConfirmed = false; S.showErrors = false; render(); } });
}
function boot(render) {
  const q = new URLSearchParams(location.search);
  ['role', 'stage', 'view', 'theme'].forEach(k => q.get(k) && (S[k] = q.get(k)));
  wire(render); render();
}
/* 04 · Móvil 390 y estados de la dirección A (recomendada). Static boards: each frame sets S, then reuses the shared panels. */
const set = o => Object.assign(S, { role: 'cajera', stage: 'abierta', view: 'inicio', fundChoice: 'float', fundConfirmed: false, showErrors: false, lastMove: null }, o);
function mTop(title, back) {
  return `<header class="m-top">${back ? `<button type="button" class="btn btn-ghost m-ib" aria-label="Volver a Caja">${ic('back', 's20')}</button>` : `<button type="button" class="btn btn-ghost m-ib" aria-label="Abrir menú">${ic('menu', 's20')}</button>`}<span class="m-title">${title}</span><span class="avatar" aria-hidden="true">${me().ini}</span></header>`;
}
function mShift() {
  const st = STATUS[S.stage];
  return `<div class="m-shift"><p class="row">${st ? badge(st[0], st[1]) : badge('Sin turno', 't-neutral')}${drawerBadge()}</p><h2 class="h-detail">Caja Principal</h2><p class="meta">Laura Méndez · desde ${D.times.open} · fondo ${mx(D.fund)}</p></div>`;
}
function mTimeline() {
  return `<ol class="m-tl" aria-label="Pasos del turno">${STEPS.map(st => {
    const s = stepState(st);
    const dot = s === 'done' ? `<span class="tl-dot done">${ic('check', 's14')}</span>` : s === 'current' ? '<span class="tl-dot cur"></span>' : s === 'next' ? '<span class="tl-dot nxt"></span>' : s === 'blocked' ? `<span class="tl-dot blk">${ic('lock', 's14')}</span>` : '<span class="tl-dot"></span>';
    return `<li class="m-tl-i is-${s}"><a href="#" class="m-tl-a">${dot}<span class="grow"><span class="m-tl-t">${st.l}</span><span class="meta" style="display:block">${stepMeta(st)}</span></span>${s !== 'upcoming' ? ic('chev') : ''}</a></li>`;
  }).join('')}</ol>`;
}
function phone(caption, body, bar = '') {
  return `<figure class="ph-wrap"><figcaption class="ph-cap">${caption}</figcaption><div class="phone"><div class="ph-scroll">${body}</div>${bar ? `<div class="m-bar">${bar}</div>` : ''}</div></figure>`;
}
function tile(caption, body) { return `<figure class="ph-wrap"><figcaption class="ph-cap">${caption}</figcaption><div class="tile">${body}</div></figure>`; }

function phones() {
  set({});
  const n = nextAction();
  const p1 = phone('1 · Tu turno (cajera, abierta)', `${mTop('Caja')}<div class="m-pad stack">${mShift()}
    <section class="next-m"><p class="next-k">Siguiente paso</p><h3 class="h-sec">${n.label}</h3><p class="meta">${n.why}</p></section>
    <a href="#" class="card pad m-recv">${ic('inbox')}<span class="grow"><span class="strong">Por recibir</span><span class="meta" style="display:block">${pendingLabel()}</span></span>${ic('chev')}</a>
    ${mTimeline()}</div>`, `${btn('Entrada o salida', { kind: 'outline', view: 'movimientos' })}${btn('Iniciar conteo', { kind: 'primary', view: 'conteo' })}`);
  set({ stage: 'sin-turno', showErrors: true });
  const p2 = phone('2 · Abrir caja con errores (resumen + junto al campo)', `${mTop('Abrir caja', true)}<div class="m-pad panel-host">${panelApertura()}</div>`);
  set({ stage: 'congelada' });
  const p3 = phone('3 · Declarar a ciegas con denominaciones', `${mTop('Conteo y declaración', true)}<div class="m-pad panel-host">${panelConteo()}</div>`);
  set({ role: 'super', stage: 'liberada' });
  const p4 = phone('4 · Supervisor: cerrar caja', `${mTop('Cerrar caja', true)}<div class="m-pad stack">${mShift()}<div class="panel-host">${panelCierre()}</div></div>`);
  set({ role: 'super', stage: 'entregada' });
  const p5 = phone('5 · Supervisor: por recibir', `${mTop('Por recibir', true)}<div class="m-pad panel-host">${panelRecibir()}</div>`);
  set({ role: 'super', stage: 'cerrada' });
  const p6 = phone('6 · Corte de caja con PDF', `${mTop('Corte de caja', true)}<div class="m-pad panel-host">${panelCorte()}</div>`);
  return [p1, p2, p3, p4, p5, p6].join('');
}
function states() {
  set({});
  const loading = tile('Cargando', `<div role="status" class="stack"><span class="sr">Cargando tu turno…</span>
    <div class="skel" style="width:120px;height:24px"></div><div class="skel" style="width:200px;height:28px"></div><div class="skel" style="width:260px;height:16px"></div>
    <div class="skel" style="height:104px;border-radius:12px"></div>
    ${[1, 2, 3, 4].map(() => '<div class="row" style="flex-wrap:nowrap;gap:12px"><div class="skel" style="width:24px;height:24px;border-radius:9999px"></div><div class="grow stack-s"><div class="skel" style="width:70%;height:14px"></div><div class="skel" style="width:45%;height:12px"></div></div></div>').join('')}
    <p class="meta">Cargando tu turno…</p></div>`);
  const noRegs = tile('Vacío: no hay cajas', `<div class="empty">${ic('store')}<h3>Aún no hay cajas</h3><p>Crea la primera para poder abrir turnos en ${D.store}.</p>${btn('Crear caja', { kind: 'primary', icon: 'plus' })}</div><p class="meta" style="text-align:center">Sin permiso para crear: «Pide a un encargado que cree la primera caja».</p>`);
  set({ stage: 'sin-turno' });
  const noShift = tile('Vacío: sin turno', `<div class="empty">${ic('wallet')}<h3>Aún no tienes un turno abierto</h3><p>Caja Principal está disponible y tiene un fondo de ${mx(D.float.a)} de ${D.float.from} listo para recibir.</p>${btn('Abrir caja', { kind: 'primary', view: 'apertura' })}</div>`);
  const error = tile('Error', `<div class="empty error" role="alert">${ic('warn')}<h3>No se pudo cargar tu turno</h3><p>Revisa la conexión e inténtalo de nuevo. No se perdió ningún dato: los movimientos ya registrados están guardados.</p>${btn('Reintentar', { kind: 'outline', icon: 'refresh' })}</div>`);
  set({ stage: 'declarada' });
  const noPerm = tile('Sin permiso (por acción)', `<div class="stack">${forbidden('verificar', 'create:CashVerification')}<div class="empty">${ic('lock')}<h3>No tienes acceso a Caja</h3><p>Pide a un encargado el permiso «Ver sesiones de caja».</p></div></div>`);
  set({ stage: 'abierta', lastMove: 'Salida de $350.00 registrada a las 15:12 · Compra de bolsas para mostrador' });
  const blindT = tile('Ventana ciega (abierta → declarar)', `<div class="stack"><dl class="ctx-kv card pad"><div><dt>Fondo inicial</dt><dd class="money">${mx(D.fund)}</dd></div><div><dt>Efectivo esperado</dt><dd><span class="hidden-amt">${ic('eyeoff', 's14')}Oculto hasta declarar</span></dd></div><div><dt>Movimientos</dt><dd><span class="hidden-amt">Ocultos hasta declarar</span></dd></div></dl>
    <p class="notice info" role="status">${ic('check', 's14')}${S.lastMove}</p>${blindNote(' Lo que registres sí cuenta para lo esperado.')}</div>`);
  set({ stage: 'entregada' });
  const locked = tile('Bloqueado', `<div class="stack">
    <div class="callout">${ic('lock')}<div><b>La caja está congelada</b><br><span class="meta">Desde las ${D.times.count} no admite cobros en efectivo ni movimientos.</span></div></div>
    <button type="button" class="rcard" role="radio" aria-checked="false" aria-disabled="true"><span class="mark">${ic('check')}</span><span class="grow"><span class="between"><span class="rc-title">Caja Estética</span>${badge('Cajón sin liberar', 't-warning')}</span><span class="rc-desc">Turno de ayer de Sofía Torres: falta liberar el cajón</span></span></button>
    <div class="stack-s"><button type="button" class="btn btn-outline btn-block" aria-disabled="true" aria-describedby="lk-r">Liberar cajón de Caja Principal</button><p class="meta" id="lk-r">Se habilita cuando Andrés Salazar y Diego Ramírez reciban sus entregas.</p></div></div>`);
  return [loading, noRegs, noShift, error, noPerm, blindT, locked].join('');
}
function render() {
  document.documentElement.dataset.theme = S.theme;
  const ph = phones(), stt = states();
  set({});
  $('#root').innerHTML = `<main class="board">
    <header class="board-h"><h1 class="page-title">Caja · móvil 390 y estados</h1><p class="page-sub">Dirección A «Turno como línea de tiempo» (recomendada). Mismos componentes y tokens; el paso abierto ocupa la pantalla y la acción principal va en la barra inferior.</p></header>
    <section aria-labelledby="h-ph"><h2 id="h-ph" class="h-sec board-sec">Pantallas en 390 px</h2><div class="ph-grid">${ph}</div></section>
    <section aria-labelledby="h-st"><h2 id="h-st" class="h-sec board-sec">Estados</h2><div class="ph-grid">${stt}</div></section>
  </main>
  <div class="demo" role="region" aria-label="Controles de la demostración"><span class="dl">Demostración</span><div class="seg" role="radiogroup" aria-label="Tema"><button type="button" role="radio" aria-checked="${S.theme === 'light'}" data-demo="theme:light">Claro</button><button type="button" role="radio" aria-checked="${S.theme === 'dark'}" data-demo="theme:dark">Oscuro</button></div></div>`;
}
document.addEventListener('click', e => { const d = e.target.closest('[data-demo]'); if (d) { S.theme = d.dataset.demo.split(':')[1]; render(); } });
{ const q = new URLSearchParams(location.search); q.get('theme') && (S.theme = q.get('theme')); }
render();

})();
</script>

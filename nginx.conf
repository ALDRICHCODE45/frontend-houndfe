server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2 application/xml;

    # SPA history-mode fallback (createWebHistory): any unknown route
    # renders index.html and lets vue-router resolve it client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets/ -> cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached aggressively or SPA updates go stale
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
